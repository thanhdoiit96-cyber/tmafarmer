<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hồi phục · Phác thảo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#334b3d;color:#493b29;font:13px system-ui,sans-serif}button,select{font:inherit;color:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #ab693b;outline-offset:2px}button:disabled{cursor:default;opacity:.5}main{min-height:100dvh;display:grid;place-items:center;padding:16px}.wrap{width:min(410px,100%)}.preview{display:flex;justify-content:center;gap:6px;margin-bottom:10px}.preview button,.preview select{border:1px solid #c0ac7e;border-radius:5px;background:#e8dbb6;padding:6px 8px;font-size:11px}.preview button[aria-pressed=true]{background:#faf0cc}.popup{border:4px solid #79573a;border-radius:8px;background:linear-gradient(100deg,#ecddb7,#fff2ce 25%);box-shadow:3px 5px #453525,0 16px 40px #17291e66}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #c4aa79;padding:10px 13px}h1{font:700 20px Georgia,serif;margin:0}.close{background:#dfc89c;border:1px solid #ac8759;border-radius:4px;width:30px;height:28px;font-size:18px}.body{padding:12px 14px}.hero{display:grid;grid-template-columns:45px 1fr auto;gap:8px;align-items:center}.symbol{font-size:30px;text-align:center;color:#69864c}.symbol.water{display:block;width:36px;height:36px;background:url('../../public/pixel/crop-care-icons-v1.png') no-repeat;background-size:144px 36px;background-position:-108px 0;image-rendering:pixelated}.hero strong{font-size:13px;display:block}.hero small{font-size:10px;color:#796748}.points{font-size:23px;font-weight:800}.points small{font-size:11px;font-weight:400}.meter{height:8px;background:#d5c59d;border-radius:5px;margin:10px 0}.meter span{display:block;height:100%;background:#709464;border-radius:inherit}.gain{display:flex;align-items:center;justify-content:space-between;font-size:11px;margin-bottom:10px}.gain b{color:#3e6b3f;background:#dbe4bd;border-radius:4px;padding:3px 6px}.primary{background:#456646;color:#fff3d3;border:1px solid #2f4d35;box-shadow:0 2px #29432e;border-radius:5px;padding:9px 12px;font-weight:750;font-size:12px}.main-action{width:100%}.note{font-size:10px;color:#796748;margin:7px 0 11px;line-height:1.5}.divider{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #cfb98c;padding-top:10px;margin-bottom:6px}.divider strong{font-size:12px}.divider small{font-size:10px;color:#796748}.items{display:grid;grid-template-columns:1fr 1fr;gap:6px}.item{position:relative;text-align:left;display:grid;grid-template-columns:32px 1fr;gap:5px;align-items:center;background:#f2e2ba;border:1px solid #c6ad7d;border-bottom:3px solid #c1a570;border-radius:5px;padding:8px 6px;min-height:65px}.item:hover{background:#e6d4a6}.item .picture{font-size:26px;text-align:center}.item strong{font-size:11px;display:block;padding-right:20px}.item small{font-size:10px;display:block;color:#655d3d;margin-top:3px}.count{position:absolute;right:5px;top:5px;background:#536f44;color:#fff1cf;border-radius:4px;min-width:19px;padding:2px;text-align:center;font-size:10px;font-weight:800}.pager{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:8px;font-size:10px}.pager button,.back{background:#ecddb5;border:1px solid #b79c68;min-width:30px;min-height:27px;border-radius:4px}.detail{text-align:center}.detail .picture{font-size:44px;margin:10px 0}.detail h2{font-size:17px;margin:6px}.effects{display:flex;justify-content:center;gap:7px;margin:12px 0}.effects span{background:#dfe4bf;border:1px solid #b5c291;padding:7px;border-radius:5px;font-size:11px}.draft{color:#d4d8bf;text-align:center;font-size:10px;margin-top:10px}.result{font-size:11px;color:#3e6543;margin:10px 0}.closed{text-align:center;padding:20px}.closed button{margin-top:12px}.mode-note{font-size:10px;color:#cbd0b6;text-align:center;margin:4px}button[hidden]{display:none}
@media(max-height:500px) and (orientation:landscape){main{padding:6px}.wrap{width:395px}.preview{margin-bottom:5px}.preview button,.preview select{padding:4px 6px}header{padding:6px 11px}h1{font-size:17px}.body{padding:8px 12px}.symbol{font-size:25px}.hero{grid-template-columns:37px 1fr auto}.points{font-size:21px}.meter{margin:6px 0;height:6px}.gain{margin-bottom:7px}.primary{padding:7px 10px}.note{margin:5px 0 7px}.divider{padding-top:6px}.item{min-height:49px;padding:5px}.pager{margin-top:6px}.draft,.mode-note{display:none}.detail .picture{margin:6px 0}.effects{margin:8px 0}}
@media(max-height:340px) and (orientation:landscape){.preview{margin-bottom:4px}.body{padding:6px 10px}header{padding:4px 10px}.hero small{font-size:9px}.symbol.water{width:24px;height:24px;background-size:96px 24px;background-position:-72px 0}.hero{grid-template-columns:28px 1fr auto}.meter{margin:4px 0}.gain{margin-bottom:5px}.primary{padding:6px 9px}.note{font-size:9px;line-height:1.3;margin:4px 0}.item{min-height:43px;padding:3px 4px;grid-template-columns:26px 1fr}.item .picture{font-size:23px}.item small{font-size:9px}.divider{padding-top:4px;margin-bottom:4px}.pager{margin-top:4px}.pager button{min-height:23px}.close{height:25px}.preview button,.preview select{font-size:10px;padding:3px 5px}}
@media(max-height:500px) and (orientation:landscape){.symbol.water{width:24px;height:24px;background-size:96px 24px;background-position:-72px 0}.hero{grid-template-columns:28px 1fr auto}.item{min-height:43px}.body{padding:6px 10px}.note{margin:4px 0;font-size:9px}.gain{margin-bottom:5px}.meter{margin:5px 0}.preview{margin-bottom:4px}.primary{padding:6px 9px}.divider{padding-top:4px}.pager{margin-top:4px}}@media(max-height:340px) and (orientation:landscape){.hero small{display:none}.item{min-height:36px}.item small{font-size:9px;margin-top:1px}.item .picture{font-size:20px}.items{gap:4px}.divider{margin-bottom:3px}.preview button,.preview select{padding:2px 4px}.meter{margin:3px 0}.note{margin:3px 0}.gain{margin-bottom:4px}.points{font-size:18px}.body{padding:5px 9px}.close{height:23px}}@media(max-height:500px) and (orientation:landscape){header{padding:4px 10px}.body{padding:4px 9px}.items{gap:4px}.item{padding:3px;min-height:39px}.note{line-height:1.3}.preview{margin-bottom:3px}}@media(max-height:340px) and (orientation:landscape){.item{min-height:34px}.note{font-size:8px}.preview button,.preview select{font-size:9px}.gain{font-size:10px}.gain b{padding:2px 4px}.primary{padding:5px 8px}header{padding:3px 9px}.hero strong{font-size:12px}.body{padding:3px 9px}}@media(max-height:340px) and (orientation:landscape){main{padding:4px}.popup{border-width:3px}}</style>
<main><div class="wrap"><nav class="preview" aria-label="Chọn bản mẫu"><button data-kind="water">Uống nước</button><button data-kind="food">Ăn cơm</button><button data-kind="stamina">Thể lực</button><select aria-label="Trạng thái minh họa" id="mode"><option value="ready">Có thể dùng</option><option value="away">Ở ngoài nhà</option><option value="wait">Đang chờ lượt</option><option value="full">Đã đầy</option></select></nav><div class="popup" role="region" aria-label="Bản mẫu popup hồi phục" id="popup"></div><p class="draft">BẢN MẪU · Đồ ăn dùng icon hiện có dạng emoji như game · Không đổi dữ liệu thật</p></div></main>
<script>
const configs={water:{title:'Uống nước',label:'Nước',symbol:'',now:38,gain:48,wait:'1 phút 30 giây',cta:'Uống nước',place:'Đến giếng',note:'Uống ở giếng hoặc Nhà vườn.'},food:{title:'Ăn cơm nắm',label:'No bụng',symbol:'🍙',now:42,gain:52,wait:'5 phút',cta:'Ăn cơm nắm',place:'Về Nhà vườn',note:'Ăn cơm nắm tại Nhà vườn.'},stamina:{title:'Nghỉ lấy sức',label:'Thể lực',symbol:'ϟ',now:28,gain:75,wait:'1 phút',cta:'Nghỉ 1 phút',place:'Về Nhà vườn',note:'Nghỉ tại Nhà vườn, hồi sức khi nghỉ xong.'}};
const meals=[{name:'Bánh mì',icon:'🍞',qty:3,gain:{stamina:22,food:28}},{name:'Nước ép cà rốt',icon:'🧃',qty:2,gain:{stamina:18,water:32}},{name:'Súp bí đỏ',icon:'🥣',qty:1,gain:{stamina:30,water:32,food:24}},{name:'Trà sữa',icon:'🧋',qty:2,gain:{stamina:55,water:40,food:28}},{name:'Nước ép nho',icon:'🍇',qty:1,gain:{stamina:45,water:55}}];let kind='water',page=0,selected=null,used=false;const popup=document.querySelector('#popup');
const mode=()=>document.querySelector('#mode').value;const head=title=>`<header><h1>${title}</h1><button class="close" data-close aria-label="Đóng">×</button></header>`;
function render(){document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.kind===kind));const c=configs[kind],m=mode(),current=m==='full'?100:c.now,blocked=m==='wait'||m==='full',items=meals.filter(i=>i.gain[kind]);
if(selected!==null){const item=items[selected];popup.innerHTML=head(item.name)+`<div class="body detail"><button class="back" data-back>‹ Hồi phục</button><div class="picture">${item.icon}</div><h2>${item.name}</h2><p class="note">Trong túi <b>${item.qty}</b> phần · Dùng 1 phần</p><div class="effects">${Object.entries(item.gain).map(([k,v])=>`<span>${configs[k].label}<br><b>+${v}</b></span>`).join('')}</div><p class="note">Dùng bữa chung lượt chờ. Giá trị hồi không vượt 100 điểm.</p>${used?'<p class="result">Đã xem thử thao tác. Không tiêu hao đồ trong túi thật.</p>':''}<button class="primary main-action" data-use ${m==='wait'?'disabled':''}>${m==='wait'?'Chờ lượt dùng bữa':'Dùng 1 phần'}</button></div>`;return;}
const buttonText=m==='full'?'Đã đầy':m==='wait'?(kind==='stamina'?'Đang nghỉ · 00:35':'Dùng lại sau · 00:35'):m==='away'?c.place:c.cta;
popup.innerHTML=head(c.title)+`<div class="body"><div class="hero"><span class="symbol ${kind}" aria-hidden="true">${c.symbol}</span><div><strong>${c.label}</strong><small>${m==='full'?'Đã đủ, tiếp tục chăm vườn':m==='wait'&&kind==='stamina'?'Đang nghỉ tại Nhà vườn':'Giữ sức để chăm vườn'}</small></div><span class="points">${current}<small>/100</small></span></div><div class="meter"><span style="width:${current}%"></span></div><div class="gain"><span>${kind==='stamina'?'Sau 1 phút nghỉ':'Một lần hồi'}</span><b>+${Math.min(100-current,c.gain)} ${c.label.toLowerCase()}</b></div><button class="primary main-action" data-main ${blocked?'disabled':''}>${buttonText}</button><p class="note">${c.note} ${kind==='stamina'?'':`Mỗi lượt cách ${c.wait}.`}</p>${used?'<p class="result">Đã xem thử thao tác; chưa kết nối game.</p>':''}<div class="divider"><strong>Đồ trong túi</strong><small>${items.length} loại dùng được</small></div><div class="items">${items.slice(page*4,page*4+4).map((i,n)=>`<button class="item" data-item="${page*4+n}"><span class="picture" aria-hidden="true">${i.icon}</span><span><strong>${i.name}</strong><small>+${i.gain[kind]} ${c.label.toLowerCase()} · Xem</small></span><b class="count" aria-label="Còn ${i.qty} phần">${i.qty}</b></button>`).join('')}</div><footer class="pager"><button data-page="${page-1}" ${page===0?'disabled':''} aria-label="Trang trước">‹</button><span>${page+1} / ${Math.ceil(items.length/4)}</span><button data-page="${page+1}" ${page+1>=Math.ceil(items.length/4)?'disabled':''} aria-label="Trang sau">›</button></footer></div>`;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.kind){kind=d.kind;page=0;selected=null;used=false;}else if('page'in d)page=+d.page;else if('item'in d){selected=+d.item;used=false;}else if('back'in d)selected=null;else if('close'in d){popup.innerHTML='<div class="closed">Đã đóng bản mẫu<br><button class="primary" data-open>Mở lại</button></div>';return;}else if('use'in d||'main'in d)used=true;render();});document.querySelector('#mode').addEventListener('change',()=>{selected=null;used=false;render();});render();
</script></html>
