<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phác thảo Sổ việc · Vườn Mùa Vui</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#263f34;color:#463b28;font:14px system-ui,sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #ae703c;outline-offset:2px}.stage{min-height:100dvh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top,#526b4b,transparent 70%)}.book{width:min(100%,390px);background:#f3e8c9;border:5px solid #795437;border-radius:14px;box-shadow:0 6px 0 #352b23,0 16px 40px #13271c77;overflow:hidden}.head{background:#3e5941;color:#fff0c7;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}.head h1{font-size:18px;margin:0}.head small{font-size:10px;letter-spacing:1px}.draft{font-size:10px;border:1px solid #a5ad80;padding:3px 6px;border-radius:4px}.tabs{display:flex;gap:5px;padding:9px 10px 0}.tabs button{border:1px solid #b49b6b;background:#dfd1ab;border-radius:7px 7px 0 0;padding:7px 10px;font-weight:700;font-size:12px}.tabs [aria-selected=true]{background:#fff5dc;border-bottom-color:#fff5dc;color:#30563b}.content{padding:12px;background:#fff5dc;margin:0 10px 10px;border:1px solid #c7b584;border-radius:0 7px 7px 7px}.summary{display:flex;gap:7px;align-items:center;justify-content:space-between;font-size:11px;margin-bottom:10px}.badge{display:inline-grid;place-items:center;min-width:24px;height:23px;border-radius:6px;background:#f0dfbb;font-weight:800;font-size:13px}.red{background:#a84e39;color:#fff5e4}.green{background:#3e7149;color:#fff8df}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.tile{position:relative;border:1px solid #c8b78a;border-bottom:3px solid #b29a65;border-radius:8px;background:#f4e8c9;min-height:111px;padding:10px 4px 7px;display:flex;align-items:center;flex-direction:column;gap:4px}.tile:hover{background:#f9edce}.tile .badge{position:absolute;right:5px;top:5px}.art{height:36px;width:36px;display:grid;place-items:center;color:#517442;font-size:28px;font-weight:700}.tile strong{font-size:12px;margin-top:3px}.tile small{font-size:10px;color:#756747}.pager{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:11px;font-size:11px}.pager button,.back{border:1px solid #baa173;background:#eddfb8;border-radius:5px;min-height:30px;min-width:32px}.pager button:disabled{opacity:.4;cursor:default}.foot{border-top:1px dashed #c9b98e;margin-top:10px;padding-top:8px;font-size:10px;color:#756747}.helper{border:0;border-top:1px dashed #c9b98e;background:none;width:100%;text-align:left;margin-top:10px;padding:9px 0 0;font-size:11px;color:#4b6543}.progress{height:6px;border-radius:8px;background:#dbcca5;margin:8px 0 12px}.progress span{display:block;width:66.66%;height:100%;background:#688852;border-radius:inherit}.entry{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid #dfd0aa}.entry .check{width:25px;height:25px;border:1px solid #a4af7b;border-radius:50%;display:grid;place-items:center;color:#3f6946;background:#e0e6c4}.entry div{flex:1;min-width:0}.entry strong{font-size:12px;display:block}.entry small{font-size:10px;color:#74694e}.entry button,.reward button{border:1px solid #5a7044;background:#456342;color:#fff2cc;padding:7px 10px;border-radius:5px;font-size:11px}.reward{display:flex;align-items:center;justify-content:space-between;margin-top:13px}.reward small{display:block;color:#756747;font-size:10px}.reward strong{font-size:13px}.reward button:disabled{background:#ded2ae;border-color:#c4b58d;color:#736644}.back{font-size:11px;padding:4px 8px}.detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.detail-head strong{font-size:13px}.hint{font-size:11px;color:#6f654c;margin:8px 0}.note{color:#dfd8bc;font-size:11px;text-align:center;margin:15px auto 0;max-width:390px}.wrap{max-width:100%}[hidden]{display:none!important}@media(max-height:500px) and (orientation:landscape){.stage{padding:8px}.wrap{width:370px}.book{width:100%;border-width:3px}.head{padding:6px 10px}.head h1{font-size:15px}.tabs{padding-top:5px}.tabs button{padding:5px 9px}.content{padding:8px;margin-bottom:6px}.summary{margin-bottom:6px}.tile{min-height:74px;padding:5px 2px;gap:0}.art{width:25px;height:25px;font-size:22px}.tile strong{font-size:11px}.badge{height:20px;min-width:21px;font-size:12px}.pager{margin-top:6px}.foot{margin-top:5px;padding-top:5px}.helper{padding-top:5px;margin-top:5px}.note{display:none}.entry{padding:6px 0}.progress{margin:5px 0}.reward{margin-top:7px}}
@media(max-height:340px) and (orientation:landscape){.stage{padding:4px}.head small{display:none}.head{padding:4px 9px}.tabs button{padding:4px 8px}.content{padding:6px;margin-bottom:5px}.summary{margin-bottom:4px}.tile{min-height:65px}.art{height:22px;font-size:20px}.helper{padding-top:4px;margin-top:4px}.pager{margin-top:4px}.pager button{min-height:25px}.entry{padding:5px 0}.reward{margin-top:5px}}</style>
<main class="stage"><div class="wrap"><section class="book"><header class="head"><div><small>VƯỜN MÙA VUI</small><h1>Sổ nhà nông</h1></div><span class="draft">PHÁC THẢO</span></header><nav class="tabs" aria-label="Sổ nhà nông"><button data-tab="tasks" aria-selected="true">Việc cần làm</button><button data-tab="journal" aria-selected="false">Sổ việc hôm nay <b>2/3</b></button></nav><div class="content" id="content"></div></section><p class="note">Dữ liệu minh họa · Chạm nhóm để xem chi tiết. Không thực hiện thao tác trong game.</p></div></main>
<script>
const groups=[['Trị sâu',3,'ô cây','✦','red'],['Nhổ cỏ',2,'ô cây','♧','red'],['Cho ăn',4,'vật nuôi','♧','red'],['Thu cây',6,'ô cây','✓','green'],['Thu sản phẩm',3,'vật nuôi','✓','green'],['Tưới cây',8,'ô cây','♧','red'],['Chăm ao',2,'lứa cần ăn','≈','red'],['Thu thủy sản',1,'lứa sẵn sàng','≈','green'],['Cuốc đất',4,'ô đất','⌁','red']];let page=0,detailPage=0,tab='tasks',selected=null;
const content=document.querySelector('#content');const pager=(p,total)=>`<footer class="pager"><button data-page="${p-1}" ${p===0?'disabled':''} aria-label="Trang trước">‹</button><span>${p+1} / ${total}</span><button data-page="${p+1}" ${p===total-1?'disabled':''} aria-label="Trang sau">›</button></footer>`;
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));if(tab==='journal'){content.innerHTML=`<div class="summary"><strong>Hôm nay đã xong</strong><span class="badge green">2 / 3</span></div><div class="progress"><span></span></div>${[['Chăm cây','Đã hoàn thành',true],['Thu hoạch hoặc lấy sản phẩm','Đã hoàn thành',true],['Bán nông sản hoặc giao đơn','Làm một việc là được',false]].map(([n,s,done])=>`<div class="entry"><span class="check">${done?'✓':'○'}</span><div><strong>${n}</strong><small>${s}</small></div>${done?'':`<button data-market>Ra chợ ›</button>`}</div>`).join('')}<div class="reward"><div><small>Thưởng đủ 3 việc</small><strong>25 xu <span style="font-weight:400">+ XP</span></strong></div><button disabled>Còn 1 việc</button></div>`;return;}if(selected!==null){const g=groups[selected];content.innerHTML=`<div class="detail-head"><button class="back" data-back>‹ Các nhóm</button><strong>${g[0]} <span class="badge ${g[4]}">${g[1]}</span></strong></div><p class="hint">Chọn nơi cần làm · Không tự thực hiện tất cả</p>${Array.from({length:Math.min(g[1]-detailPage*3,3)},(_,i)=>`<div class="entry"><span class="check">${i+1}</span><div><strong>${selected===2?['Cừu','Bò','Gà'][i]:'Ô '+(detailPage*3+i+1)+' · '+['Bắp','Cà rốt','Cà chua'][i]}</strong><small>${selected===2?'Chuồng chính':'Vườn nhà'} · ${g[0]}</small></div><button data-go>Đi tới ›</button></div>`).join('')}${pager(detailPage,Math.ceil(g[1]/3))}<p class="foot">Bản mẫu: nút Đi tới chưa nối với game.</p>`;return;}content.innerHTML=`<div class="summary"><strong>Chăm trước, thu sau</strong><span>9 nhóm công việc</span></div><div class="grid">${groups.slice(page*6,page*6+6).map((g,i)=>`<button class="tile" data-group="${page*6+i}" aria-label="${g[0]}, ${g[1]} ${g[2]}"><span class="badge ${g[4]}">${g[1]}</span><span class="art" aria-hidden="true">${g[3]}</span><strong>${g[0]}</strong><small>${g[2]}</small></button>`).join('')}</div>${pager(page,2)}<button class="helper" data-helper>Thuê người chăm vườn <span style="float:right">›</span></button>`;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;selected=null;}else if('group'in b.dataset){selected=+b.dataset.group;detailPage=0;}else if('back'in b.dataset)selected=null;else if('page'in b.dataset){if(selected!==null)detailPage=+b.dataset.page;else page=+b.dataset.page;}else if('helper'in b.dataset){alert('Khi tích hợp: mở bảng chọn thuê chăm vườn hiện có, giữ xác nhận phí.');return;}else if('go'in b.dataset||'market'in b.dataset){alert('Bản mẫu bố cục: chưa kết nối game.');return;}render();});render();
</script></html>
