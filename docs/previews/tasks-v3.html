<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sổ nhà nông · Bản mẫu V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#334b3d;color:#493b29;font:13px system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #a45729;outline-offset:2px}button:disabled{opacity:.5;cursor:default}main{min-height:100dvh;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at top,#687758,transparent 80%)}.book{width:min(430px,100%);border:4px solid #755237;border-radius:8px;background:#ecdfbb;box-shadow:3px 5px #453525,0 16px 40px #17291e66;position:relative}.book:before{content:'';position:absolute;left:9px;top:0;bottom:0;width:4px;border-left:1px solid #ad8c5e;border-right:1px solid #fff0c8;pointer-events:none}header{display:flex;justify-content:space-between;align-items:center;padding:11px 17px 7px 23px}h1{font-size:20px;margin:0;font-family:Georgia,serif}header small{color:#786340;font-size:10px}.tabs{display:flex;gap:3px;padding:0 13px 0 23px}.tabs button{padding:7px 12px;border:1px solid #ad8e5c;background:#d6c59b;border-radius:5px 5px 0 0;font-weight:750;font-size:12px}.tabs [aria-selected=true]{background:#fff2ce;border-bottom-color:#fff2ce;color:#36583c}article{padding:11px 12px 12px 23px;background:linear-gradient(90deg,#edddb5,#fff2ce 12%);border-top:1px solid #c7ae7d;min-height:310px}h2{font-size:14px;margin:0}.subhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.subhead small,.muted{font-size:10px;color:#7b694b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.task{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:5px;align-items:center;min-height:57px;padding:7px 0;background:none;border:0;border-bottom:1px solid #d8c499;text-align:left}.task:hover{background:#e5d5aa66}.task strong{display:block;font-size:12px}.task small{display:block;font-size:10px;color:#796748;margin-top:2px}.badge{display:inline-grid;place-items:center;min-width:24px;height:23px;border-radius:5px;background:#ece0bd;font-size:13px;font-weight:800}.need{background:#ad523e;color:#fff2d7}.ready{background:#466e47;color:#fff3d5}.icon{display:inline-block;width:24px;height:24px;background-image:url('../../public/pixel/crop-care-icons-v1.png');background-size:96px 24px;image-rendering:pixelated;background-repeat:no-repeat}.harvest{background-position:0 0}.pests{background-position:-24px 0}.weeds{background-position:-48px 0}.water{background-position:-72px 0}.feed,.collect{background-image:url('../../public/pixel/animal-task-icons-v1.png');background-size:48px 24px}.feed{background-position:-24px 0}.collect{background-position:0 0}.till{background-image:url('../../public/pixel/till-task-icon-v1.png');background-size:24px 24px}.pond{background:none;font-size:25px;color:#487b86;text-align:center}.pager{display:flex;align-items:center;justify-content:center;gap:17px;margin:10px 0;font-size:11px}.pager button,.back{border:1px solid #bba06d;border-radius:4px;background:#efdfb5;min-width:32px;min-height:29px}.hire{margin-top:10px;padding:10px;border:1px solid #9c7d48;border-bottom:3px solid #8f703e;border-radius:5px;background:#e1cd91;display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}.hire strong{display:block;font-size:13px}.hire small{display:block;margin-top:3px;font-size:10px;color:#68502f}.primary{background:#426344;color:#fff3d3;border:1px solid #2f4d35;box-shadow:0 2px #29432e;border-radius:5px;padding:8px 10px;font-weight:700;font-size:12px}.ribbon{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#82633b;margin-bottom:3px}.back{font-size:11px;padding:4px 7px}.choices{display:flex;gap:5px;margin:8px 0}.choices button{flex:1;padding:7px 4px;border:1px solid #bea16b;background:#ead8aa;border-radius:4px;font-size:11px}.choices [aria-pressed=true]{background:#456646;color:#fff0d1;border-color:#456646}.plots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.plot{display:flex;align-items:center;gap:4px;border:1px solid #cfb783;background:#f3e4bc;border-radius:4px;padding:9px 5px;font-size:11px}.plot input{accent-color:#4c7247}.plot small{display:block;font-size:9px;color:#7f6b46}.bill{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #bba372;font-size:11px}.bill strong{font-size:18px}.info{font-size:10px;color:#715c3b;line-height:1.5;margin:7px 0}.checkline{display:flex;justify-content:space-between;align-items:center;margin:6px 0;font-size:11px}.checkline input{accent-color:#4c7247}.entry{display:flex;align-items:center;gap:8px;border-bottom:1px solid #d8c499;padding:11px 0}.entry>div{flex:1}.entry strong{font-size:12px;display:block}.entry small{font-size:10px;color:#7b694b}.tick{color:#4e7046;font-size:22px;width:26px}.progress{height:5px;background:#d8c499;margin:10px 0}.progress span{display:block;height:100%;width:66.66%;background:#6a854f}.reward{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.reward small{display:block;color:#786442;font-size:10px}.notice{padding:15px 0;font-size:12px;line-height:1.7}.draft{position:fixed;bottom:5px;right:8px;color:#c7cdb8;font-size:9px}.scroll{max-height:130px;overflow:auto;scrollbar-width:auto;scrollbar-color:#9c8051 #e3d2aa}.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:#9c8051;border-radius:5px}.scroll::-webkit-scrollbar-track{background:#e3d2aa}[hidden]{display:none!important}
@media(max-height:500px) and (orientation:landscape){main{padding:7px}.book{width:395px;border-width:3px}header{padding-top:6px;padding-bottom:5px}h1{font-size:17px}.tabs button{padding:5px 10px}article{min-height:0;padding-top:7px;padding-bottom:8px}.subhead{margin-bottom:5px}.task{min-height:46px;padding:4px 0}.pager{margin:7px 0}.hire{margin-top:6px;padding:7px}.entry{padding:8px 0}.reward{margin-top:10px}.plots{margin:7px 0}.plot{padding:6px 4px}.info{margin:5px 0}.draft{display:none}}
@media(max-height:340px) and (orientation:landscape){header small{display:none}header{padding-top:4px;padding-bottom:4px}.tabs button{padding:4px 9px}article{padding-top:6px;padding-bottom:7px}.task{min-height:41px}.pager{margin:5px 0}.pager button{min-height:25px}.hire{padding:6px;margin-top:5px}.hire small{margin-top:2px}.primary{padding:6px 8px}.choices{margin:6px 0}.plot{padding:5px 4px}.plots{gap:4px;margin:6px 0}.bill{padding:5px 0}.info{font-size:9px}.entry{padding:6px 0}.reward{margin-top:8px}}
@media(max-height:500px) and (orientation:landscape){.choices{margin:5px 0}.choices button{padding:5px 4px}.plot{padding:4px}.plots{margin:5px 0}.checkline{margin:4px 0}.bill{padding:5px 0}.info{margin:3px 0}.subhead .back{min-height:25px}.bill .primary{padding:6px 8px}}@media(max-height:340px) and (orientation:landscape){.plot small{display:none}.plots{margin:4px 0}.plot{padding:4px 3px}.choices button{padding:4px}.checkline{margin:2px 0}.bill{padding:3px 0}.bill strong{font-size:15px}.info{font-size:9px;line-height:1.3}.subhead{margin-bottom:3px}}@media(max-height:340px) and (orientation:landscape){main{padding:4px}.task{min-height:36px}.hire .ribbon{display:none}.hire{padding:5px}.hire strong{font-size:12px}.hire small{line-height:1.25}.tabs button{font-size:11px}header{padding-top:3px;padding-bottom:3px}.pager{margin:4px 0}article{padding-top:4px;padding-bottom:5px}}@media(max-height:340px) and (orientation:landscape){.bill+p.info{display:none}}</style>
<main><section class="book"><header><h1>Sổ nhà nông</h1><small>VƯỜN MÙA VUI</small></header><nav class="tabs" aria-label="Sổ nhà nông"><button data-tab="tasks" aria-selected="true">Việc cần làm</button><button data-tab="journal" aria-selected="false">Sổ hôm nay · 2/3</button></nav><article id="content"></article></section></main><span class="draft">PHÁC THẢO V3 · DỮ LIỆU MINH HỌA</span>
<script>
const groups=[['Trị sâu',3,'ô cây','pests','need'],['Nhổ cỏ',2,'ô cây','weeds','need'],['Cho ăn',4,'vật nuôi','feed','need'],['Thu cây',6,'ô cây','harvest','ready'],['Thu sản phẩm',3,'vật nuôi','collect','ready'],['Tưới cây',8,'ô cây','water','need'],['Cho thủy sản ăn',2,'lứa','pond','need'],['Thu thủy sản',1,'lứa','pond','ready'],['Cuốc đất',4,'ô đất','till','need']];
let tab='tasks',view='groups',page=0,detail=0,detailPage=0,action='water',checked=new Set([0,1,2]),keep=true;const content=document.querySelector('#content');
const pager=(p,total)=>`<footer class="pager"><button data-page="${p-1}" ${p===0?'disabled':''} aria-label="Trang trước">‹</button><span>${p+1} / ${total}</span><button data-page="${p+1}" ${p===total-1?'disabled':''} aria-label="Trang sau">›</button></footer>`;
const icon=g=>`<span class="icon ${g[3]}" aria-hidden="true">${g[3]==='pond'?'≈':''}</span>`;
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
if(tab==='journal'){content.innerHTML=`<div class="subhead"><h2>Ba việc mỗi ngày</h2><span class="badge ready">2/3</span></div><div class="progress"><span></span></div>${[['Chăm cây',true],['Thu hoạch hoặc lấy sản phẩm',true],['Bán nông sản hoặc giao đơn',false]].map(([name,done])=>`<div class="entry"><span class="tick">${done?'✓':'○'}</span><div><strong>${name}</strong><small>${done?'Đã hoàn thành':'Làm một việc là được'}</small></div>${done?'':'<button class="primary" data-route>Ra chợ ›</button>'}</div>`).join('')}<div class="reward"><div><small>Thưởng đủ ba việc</small><strong>25 xu + XP</strong></div><button class="primary" disabled>Còn 1 việc</button></div>`;return;}
if(view==='hire'){const count=action==='water'?8:6,fee=action==='water'?2:4;content.innerHTML=`<div class="subhead"><button class="back" data-back>‹ Sổ việc</button><h2>Nhờ Cô Lan chăm vườn</h2></div><div class="choices"><button data-hire-action="water" aria-pressed="${action==='water'}">Tưới · 2 xu/ô</button><button data-hire-action="harvest" aria-pressed="${action==='harvest'}">Thu hoạch · 4 xu/ô</button></div><div class="checkline"><label><input type="checkbox" data-all ${checked.size===count?'checked':''}> Chọn cả ${count} ô</label><span>Đã chọn <b>${checked.size}</b></span></div><div class="plots">${Array.from({length:Math.min(count-page*6,6)},(_,i)=>{const n=page*6+i;return `<label class="plot"><input type="checkbox" data-plot="${n}" ${checked.has(n)?'checked':''}><span>Ô ${n+1}<small>${['Bắp','Cà rốt','Lúa mì'][n%3]}</small></span></label>`}).join('')}</div>${pager(page,Math.ceil(count/6))}${action==='harvest'?`<label class="info"><input type="checkbox" data-keep ${keep?'checked':''}> Giữ giống theo tùy chọn thu hoạch</label>`:''}<div class="bill"><span>Phí thuê <b>${checked.size}</b> ô<br><small>Trong túi: 240 xu</small></span><span><strong>${checked.size*fee}</strong> xu</span><button class="primary" data-confirm ${checked.size?'':'disabled'}>Thuê ${action==='water'?'tưới':'thu hoạch'}</button></div><p class="info">Cô Lan đi chăm từng ô, không hoàn tất tức thì.</p>`;return;}
if(view==='confirm'){const fee=action==='water'?2:4;content.innerHTML=`<div class="subhead"><button class="back" data-edit>‹ Chọn ô</button><h2>Xác nhận thuê</h2></div><p class="notice">Nhờ Cô Lan <b>${action==='water'?'tưới cây':'thu hoạch'}</b> trên <b>${checked.size} ô</b> đã chọn.<br>Chi phí: <b>${checked.size*fee} xu</b> · Còn lại: <b>${240-checked.size*fee} xu</b>.</p><p class="info">Đây là bản mẫu, không trừ xu và không gửi thao tác vào game.</p><button class="primary" data-demo>Đồng ý · ${checked.size*fee} xu</button>`;return;}
if(view==='sent'){content.innerHTML='<h2>Đã xem thử bước thuê</h2><p class="notice">Khi tích hợp, tại đây sẽ hiển thị Cô Lan đang chăm vườn, số ô đã xong và thời gian còn lại từ dữ liệu thật.</p><button class="back" data-back>‹ Về Sổ việc</button>';return;}
if(view==='detail'){const g=groups[detail];content.innerHTML=`<div class="subhead"><button class="back" data-back>‹ Các nhóm</button><h2>${g[0]} <span class="badge ${g[4]}">${g[1]}</span></h2></div>${Array.from({length:Math.min(3,g[1]-detailPage*3)},(_,i)=>`<div class="entry">${icon(g)}<div><strong>${detail===2?['Cừu','Bò','Gà'][i]:'Ô '+(detailPage*3+i+1)+' · '+['Bắp','Cà rốt','Lúa mì'][i]}</strong><small>${detail===2?'Chuồng chính':'Vườn nhà'}</small></div><button class="primary" data-route>Đi tới ›</button></div>`).join('')}${pager(detailPage,Math.ceil(g[1]/3))}${detail===3||detail===5?`<button class="primary" data-hire-from="${detail===3?'harvest':'water'}">Nhờ Cô Lan ${detail===3?'thu hoạch':'tưới cây'}</button>`:''}`;return;}
content.innerHTML=`<div class="subhead"><h2>Vườn đang cần bạn</h2><small>9 nhóm việc</small></div><div class="grid">${groups.slice(page*6,page*6+6).map((g,i)=>`<button class="task" data-group="${page*6+i}">${icon(g)}<span><strong>${g[0]}</strong><small>${g[2]}</small></span><span class="badge ${g[4]}">${g[1]}</span></button>`).join('')}</div>${pager(page,2)}<section class="hire"><div><div class="ribbon">Có người giúp bạn</div><strong>Nhờ Cô Lan chăm vườn</strong><small>Tưới 8 ô · 2 xu/ô<br>Thu hoạch 6 ô · 4 xu/ô</small></div><button class="primary" data-hire>Thuê chăm vườn ›</button></section>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.tab){tab=d.tab;view='groups';page=0;}else if('group'in d){detail=+d.group;detailPage=0;view='detail';}else if('back'in d){view='groups';page=0;}else if('hire'in d||'hireFrom'in d){view='hire';page=0;action=d.hireFrom||'water';checked=new Set([0,1,2]);}else if('hireAction'in d){action=d.hireAction;page=0;checked=new Set();}else if('page'in d){if(view==='detail')detailPage=+d.page;else page=+d.page;}else if('confirm'in d)view='confirm';else if('edit'in d)view='hire';else if('demo'in d)view='sent';else if('route'in d){alert('Bản mẫu: khi tích hợp sẽ đưa nhân vật tới đúng đối tượng.');return;}render();});
document.addEventListener('change',e=>{const d=e.target.dataset;if('plot'in d){if(e.target.checked)checked.add(+d.plot);else checked.delete(+d.plot);}else if('all'in d)checked=e.target.checked?new Set(Array.from({length:action==='water'?8:6},(_,i)=>i)):new Set();else if('keep'in d)keep=e.target.checked;else return;render();});render();
</script></html>
