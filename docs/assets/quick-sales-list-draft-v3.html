<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bán nhanh — danh sách phân trang</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e4d4;color:#493e2a;font:13px system-ui,sans-serif}header{max-width:1000px;margin:24px auto 12px;padding:0 16px}h1{font-size:20px;margin:0 0 6px}header p{margin:0;line-height:1.6;color:#74664e}.stage{max-width:1000px;margin:auto;display:grid;grid-template-columns:1fr 304px;gap:14px;padding:16px}.scene{border:3px solid #665437;border-radius:10px;background:#486047 url('market-viewport-v1.png') center/cover;min-height:480px}.book{background:#e9ddba;border:2px solid #85704b;box-shadow:inset 0 0 0 2px #fff2cd,0 3px #695335;border-radius:9px;padding:9px;display:flex;flex-direction:column;gap:8px;min-width:0}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #3c7257;outline-offset:2px}.heading{display:flex;align-items:center;justify-content:space-between;min-height:28px}.heading strong{font-family:Georgia,serif;font-size:20px;color:#35543f}.heading button{border:0;background:none;font-size:12px}.tabs{display:flex;gap:4px;border-bottom:1px solid #baa578;padding-bottom:7px}.tabs span{flex:1;text-align:center;font-size:11px;padding:5px 0}.tabs .active{border-radius:4px;background:#365641;color:#fff5dc}.products{display:flex;flex-direction:column;background:#f8edcf;border:1px solid #b49d70;border-radius:6px;overflow:visible;min-width:0;padding:0 7px}.product{display:flex;align-items:center;gap:8px;padding:10px 0;min-width:0;min-height:78px;border-bottom:1px dashed #c9b58a}.product:last-child{border-bottom:0}.info{display:flex;flex:1;align-items:center;gap:8px;min-width:0;text-align:left;border:0;background:none;padding:0}.art{width:44px;height:48px;flex:none;display:grid;place-items:center}.sprite{width:24px;height:24px;image-rendering:pixelated;background-repeat:no-repeat;transform:scale(1.666667)}.description{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}.name{font-size:12px;line-height:16px;font-weight:700;white-space:normal;overflow-wrap:anywhere}.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:10px;line-height:15px}.owned{display:flex;gap:3px;align-items:center;color:#756347}.badge{display:inline-block;border-radius:4px;background:#526d45;color:#fff8df;padding:0 5px;font-size:11px;min-width:20px;text-align:center;font-weight:700}.price{color:#846731;white-space:nowrap}.sell{flex:none;border:1px solid #2c4c35;background:#3e6348;color:#fff5d8;border-radius:5px;min-width:44px;min-height:34px;padding:5px;font-size:11px;font-weight:700;box-shadow:0 2px #29422f}.pager{display:flex;justify-content:center;align-items:center;gap:14px;font-size:11px;min-height:30px}.pager button{border:1px solid #b69b64;background:#f6e7c3;border-radius:5px;width:30px;height:30px}.pager button:disabled{opacity:.4}.hint{font-size:10px;line-height:15px;color:#796b50;text-align:center;margin:0}.search{display:none;width:100%;padding:6px;background:#fff5dc;border:1px solid #b7a275;border-radius:4px}.search.open{display:block}.empty{text-align:center;font-size:12px;padding:20px 0}dialog{width:min(320px,calc(100vw - 24px));border:2px solid #85704b;border-radius:9px;background:#f6eacb;color:#493e2a;padding:15px;max-height:calc(100dvh - 16px);overflow:auto}dialog::backdrop{background:#26372880}dialog h2{font-family:Georgia,serif;color:#35543f;font-size:20px;margin:0 0 9px}.dialog-head{display:flex;align-items:center;justify-content:space-between}.close{background:none;border:0;font-size:22px;min-width:32px;min-height:32px}.dialog-content{display:flex;align-items:center;gap:10px;margin:8px 0 15px}.dialog-content p{margin:3px 0;font-size:12px}label{display:block;font-size:12px}label input{width:100%;margin:5px 0 10px;padding:7px;border:1px solid #b29c6b;background:#fff7e1;border-radius:4px}.dialog-actions{display:flex;gap:8px;align-items:center}.dialog-actions .sell{flex:1}.all{background:#e8d29e;border:1px solid #b49a62;border-radius:5px;padding:7px;min-height:34px;font-size:11px}.notice{font-size:11px;color:#47643c;min-height:15px}
@media(max-height:600px) and (orientation:landscape){header{display:none}.stage{padding:4px;gap:7px;height:100dvh;grid-template-columns:1fr 304px}.scene{min-height:0}.book{padding:6px;gap:6px}.heading{min-height:24px}.heading strong{font-size:18px}.tabs{padding-bottom:4px}.tabs span{padding:3px 0}.hint{display:none}.product{min-height:80px}.name{font-size:11px;line-height:15px}.products{padding:0 6px}}
@media(max-height:340px) and (orientation:landscape){.book{gap:5px}.product{min-height:84px}.art{width:40px}.sprite{transform:scale(1.5)}}
</style><header><h1>Bán nhanh — danh sách dọc có phân trang</h1><p>Ảnh trái, tên và thông tin ở giữa, một nút Bán bên phải. Khung 304px · dữ liệu mô phỏng, không giao dịch thật.</p></header><main class="stage"><div class="scene" aria-label="Bối cảnh chợ hiện có"></div><section class="book"><div class="heading"><strong>Bán nhanh</strong><button id="search-toggle" aria-expanded="false">Tìm món ⌕</button></div><nav class="tabs"><span>Đơn làng</span><span>Sạp</span><span>Vật tư</span><span class="active">Bán nhanh</span></nav><input class="search" placeholder="Tìm nông sản…" aria-label="Tìm nông sản"><div class="products"></div><div class="pager"><button id="prev" aria-label="Trang trước">‹</button><span id="page"></span><button id="next" aria-label="Trang sau">›</button></div><p class="hint">Chạm ảnh hoặc tên để xem thông tin món hàng.</p></section></main><dialog aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="close" aria-label="Đóng">×</button></div><div class="dialog-content"></div><div id="sale-controls"><label>Số lượng bán<input id="quantity" type="number" min="1" value="1"></label><div class="dialog-actions"><button class="all">Bán hết</button><button class="sell" id="confirm"></button></div></div><p class="notice" role="status"></p></dialog><script>
const items=[{id:'wheat',name:'Lúa mì',count:24,price:6,y:0},{id:'carrot',name:'Cà rốt',count:12,price:10,y:24},{id:'corn',name:'Bắp',count:8,price:15,y:48},{id:'tomato',name:'Cà chua',count:16,price:18,extra:true,y:0},{id:'sunflower',name:'Hướng dương',count:1234,price:23,extra:true,y:24},{id:'strawberry',name:'Dâu chất lượng cao',count:9,price:34,extra:true,y:48},{id:'tea',name:'Trà',count:28,price:45,extra:true,y:96},{id:'pumpkin',name:'Bí đỏ',count:4,price:50,extra:true,y:168}];let page=0,size=4,selected=null;const $=s=>document.querySelector(s);const fmt=n=>n.toLocaleString('vi-VN');const art=i=>`<span class="art"><span class="sprite" style="background-image:url('../../public/pixel/${i.extra?'crop-stages-v2.png':'vertical-slice-v2-hd.png'}');background-size:${i.extra?'96px 216px':'384px 128px'};background-position:-${i.extra?72:168}px -${i.y}px"></span></span>`;function render(){const nextSize=innerHeight<=340?2:innerHeight<=600?3:4;if(size!==nextSize){page=Math.floor(page*size/nextSize);size=nextSize}const q=$('.search').value.toLocaleLowerCase('vi');const list=items.filter(i=>i.name.toLocaleLowerCase('vi').includes(q)),pages=Math.max(1,Math.ceil(list.length/size));page=Math.max(0,Math.min(page,pages-1));$('.products').innerHTML=list.slice(page*size,(page+1)*size).map(i=>`<article class="product"><button class="info" data-info="${i.id}" aria-label="Chi tiết ${i.name}">${art(i)}<span class="description"><strong class="name">${i.name}</strong><span class="meta"><span class="owned">Kho <b class="badge">${fmt(i.count)}</b></span><span class="price">${fmt(i.price)} xu/món</span></span></span></button><button class="sell" data-sell="${i.id}" aria-label="Bán ${i.name}">Bán</button></article>`).join('')||'<p class="empty">Không tìm thấy món hàng.</p>';$('#page').textContent=(page+1)+' / '+pages;$('#prev').disabled=page===0;$('#next').disabled=page===pages-1}function total(){const input=$('#quantity'),n=input.valueAsNumber;$('#confirm').textContent=input.validity.valid?'Bán · '+fmt(n*selected.price)+' xu':'Chọn số lượng';$('#confirm').disabled=!input.validity.valid}function open(id,sale){selected=items.find(i=>i.id===id);$('#dialog-title').textContent=(sale?'Bán ':'')+selected.name;$('.dialog-content').innerHTML=art(selected)+`<div><p>Trong kho: <b>${fmt(selected.count)}</b> món</p><p>Đơn giá: <b>${fmt(selected.price)}</b> xu/món</p></div>`;$('#sale-controls').hidden=!sale;$('#quantity').max=selected.count;$('#quantity').value=1;$('.notice').textContent='';total();$('dialog').showModal()}$('.products').onclick=e=>{const sale=e.target.closest('[data-sell]'),info=e.target.closest('[data-info]');if(sale)open(sale.dataset.sell,true);else if(info)open(info.dataset.info,false)};$('#prev').onclick=()=>{page--;render()};$('#next').onclick=()=>{page++;render()};$('#search-toggle').onclick=()=>{const on=$('.search').classList.toggle('open');$('#search-toggle').setAttribute('aria-expanded',on);if(on)$('.search').focus()};$('.search').oninput=()=>{page=0;render()};$('.close').onclick=()=>$('dialog').close();$('#quantity').oninput=total;$('.all').onclick=()=>{$('#quantity').value=selected.count;total();$('.notice').textContent='Mô phỏng: cần xác nhận trước khi bán hết.'};$('#confirm').onclick=()=>$('.notice').textContent='Mô phỏng, chưa thực hiện giao dịch.';addEventListener('resize',render);render();
</script></html>
