</style></head><body><header class="review"><span>PHÁC THẢO V4 · Chỉ mô phỏng, chưa đổi game</span><button data-view="animals">Sổ chuồng</button><button data-view="orders">Bảng đơn</button></header><main class="stage"><img id="scene" class="scene" src="coop-viewport-v8.png" alt="Bối cảnh game hiện có"><div class="place" id="place">Chuồng trại</div><div class="hud"><span>Ngày 1</span><span>100 xu</span></div><section class="board"><header class="board-head"><h1 id="title"></h1><small id="meta"></small></header><div id="content" class="board-body"></div></section><p id="notice" class="game-notice" role="status" aria-live="polite"></p></main><dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div><div class="game-actions"><button id="close">Để sau</button><button id="confirm" class="primary">Xác nhận</button></div></dialog><script>
const $=s=>document.querySelector(s),animals=[{name:'Cừu',x:-84,mx:-56,state:'hungry',action:'3 phần',yield:'1 len',eta:'~3 phút'},{name:'Dê sữa',x:0,mx:0,state:'ready',action:'Thu 3',yield:'3 sữa dê',eta:'Sẵn sàng'},{name:'Ngỗng',x:-168,mx:-112,state:'growing',yield:'3 trứng',eta:'~12 phút'},{name:'Thỏ',x:-252,mx:-168,state:'growing',yield:'3 thịt thỏ',eta:'~28 phút'}];
let view='animals',filter='all',page=0,order='village',selected=0,pinned=null,mine=1,confirmAction=null,noticeTimer;
const delivered=[10,4,8],required=[16,12,12],stock=[4,1,0],names=['Lúa mì','Cà rốt','Bắp'];
const portrait=a=>'<span class="portrait" style="--sprite:'+a.x+'px;--mobile-sprite:'+a.mx+'px" aria-hidden="true"></span>';
function notify(copy){clearTimeout(noticeTimer);$('#notice').textContent=copy;noticeTimer=setTimeout(()=>$('#notice').textContent='',2300)}
function open(title,body,action){$('#dialog').close();$('#dialog-body').innerHTML='<h2 id="dialog-title">'+title+'</h2>'+body;confirmAction=action;$('#confirm').hidden=!action;$('#dialog').showModal()}
function render(){
 document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));$('#scene').src=view==='animals'?'coop-viewport-v8.png':'market-viewport-v1.png';$('#place').textContent=view==='animals'?'Chuồng trại':'Chợ làng';$('#title').textContent=view==='animals'?'Sổ chuồng':'Bảng đơn';$('#meta').textContent=view==='animals'?'8 / 12 chỗ':'Cả làng cùng góp';
 if(view==='animals'){
 const list=Array.from({length:8},(_,i)=>({...animals[i%4],id:i})).filter(a=>filter==='all'||a.state===filter),pages=Math.max(1,Math.ceil(list.length/6));page=Math.min(page,pages-1);
 $('#content').innerHTML='<nav class="chips" aria-label="Lọc vật nuôi">'+[['all','Tất cả'],['ready','Thu · 2'],['hungry','Cần ăn · 2']].map(([id,label])=>'<button class="chip" data-filter="'+id+'" aria-pressed="'+(filter===id)+'">'+label+'</button>').join('')+'</nav><div class="animal-grid">'+list.slice(page*6,page*6+6).map(a=>'<article class="animal-tile" data-state="'+a.state+'"><span class="status">'+(a.state==='ready'?'Sẵn sàng':a.state==='hungry'?'Đói':a.name==='Thỏ'?'Đang lớn':'Đang tạo trứng')+'</span><button class="portrait-hit" data-detail="'+a.id+'" aria-label="Quản lý '+a.name+' '+(a.id+1)+'">'+portrait(a)+'</button><h2>'+a.name+' '+(a.id+1)+'</h2>'+(a.action?'<button class="tile-action '+(a.state==='hungry'?'feed':'')+'" data-care="'+a.id+'" aria-label="'+(a.state==='ready'?'Thu sản phẩm':'Cho ăn')+' '+a.name+' '+(a.id+1)+'"><span class="task '+(a.state==='hungry'?'feed':'')+'" aria-hidden="true"></span>'+a.action+'</button>':'<span class="timer">'+a.eta+'</span>')+'</article>').join('')+'</div><footer class="pager"><button data-page="-1" '+(!page?'disabled':'')+' aria-label="Trang trước">‹</button><span>'+(page+1)+' / '+pages+'</span><button class="add" data-adopt>＋ Đón thêm</button><button data-page="1" '+(page===pages-1?'disabled':'')+' aria-label="Trang sau">›</button></footer><div class="board-foot">Túi: 10 thức ăn · Chạm hình để quản lý</div>';
 }else{
 const i=selected,max=Math.min(stock[i],Math.max(0,required[i]-delivered[i]));
 $('#content').innerHTML='<nav class="tabs" aria-label="Loại đơn"><button class="chip" data-order="market" aria-pressed="'+(order==='market')+'">Đơn chợ</button><button class="chip" data-order="village" aria-pressed="'+(order==='village')+'">Góp hàng làng</button></nav><section class="paper"><header class="paper-head"><h2>'+(order==='village'?'Giỏ nông sản':'Giỏ rau sáng')+'</h2><span class="seal">'+(order==='village'?delivered.reduce((a,b)=>a+b,0)+'/40':'18 xu')+'</span></header><p class="deadline">'+(order==='village'?'Còn 30 giờ thực':'Giao đủ một lần · Người giao trước nhận')+'</p><div class="ingredients">'+(order==='village'?names:['Cà rốt']).map((name,j)=>{const k=order==='village'?j:1;return '<button class="ingredient" data-select="'+k+'" aria-pressed="'+(k===i)+'"><span class="crop" style="--crop:-'+k*48+'px;--mobile-crop:-'+k*36+'px" aria-hidden="true"></span>'+(pinned===k?'<span class="pin" aria-label="Đang ghim">◆</span>':'')+'<strong>'+name+'</strong><strong>'+(order==='village'?'Thiếu '+Math.max(0,required[k]-delivered[k]):'1 / 2')+'</strong><small>Kho '+stock[k]+'</small></button>'}).join('')+'</div><div class="chosen"><div class="chosen-title"><strong>'+names[i]+'</strong><span>'+(max?'Góp tối đa '+max:'Chưa có hàng')+'</span></div><div class="game-actions"><button class="primary" data-donate '+(!max||order==='market'?'disabled':'')+'>'+(order==='market'?'Giao':'Góp')+'</button><button data-pin>'+(pinned===i?'Bỏ ghim':'Ghim')+'</button><button data-source>Cách có</button></div><p class="mini-note">Chọn hình nguyên liệu để chuẩn bị.</p></div><footer class="reward"><span>'+(order==='village'?'Bạn góp '+mine+' · '+(mine<3?'Còn '+(3-mine)+' để đủ mốc':'Đủ mốc cá nhân'):'+4 XP khi giao đủ')+'</span><button data-rules>Quà &amp; điều kiện ›</button></footer></section><div class="wood-note"><button class="chip" data-people>Người cùng góp</button></div>';
 }
}
$('#close').onclick=()=>$('#dialog').close();$('#confirm').onclick=()=>confirmAction?.();
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.view){view=d.view;render()}if(d.filter){filter=d.filter;page=0;render()}if(d.page){page+=Number(d.page);render()}if(d.order){order=d.order;if(order==='market')selected=1;render()}if(d.select!==undefined){selected=Number(d.select);render()}
 if(d.detail!==undefined){const a=animals[Number(d.detail)%4];open(a.name+' '+(Number(d.detail)+1),'<div class="detail-portrait">'+portrait(a)+'</div><div class="stats"><p><small>Lứa này</small><strong>'+a.yield+'</strong></p><p><small>'+(a.state==='hungry'?'Sau khi cho ăn':'Có thể thu sau')+'</small><strong>'+a.eta+'</strong></p></div><details><summary>Thức ăn &amp; sức sản xuất</summary><p>Runtime dùng đúng dữ liệu từng con, thời tiết và số lứa; không thêm công thức mới.</p></details><div class="game-actions"><button data-move>Chuyển chuồng</button><button data-sell>Bán sống…</button></div>',null)}
 if(d.care!==undefined)notify('Mô phỏng '+(animals[Number(d.care)%4].state==='ready'?'thu hoạch':'cho ăn')+' · Không tiêu tài sản thật');
 if(d.adopt!==undefined)open('Đón bạn mới','<p>Mở bộ chọn vật nuôi đang có. Không nhét danh sách mua vào sổ chăm sóc.</p>',null);
 if(d.pin!==undefined){pinned=pinned===selected?null:selected;render();notify(pinned===null?'Đã bỏ ghim (mô phỏng)':'Đã ghim trong Việc cần làm (mô phỏng)')}
 if(d.source!==undefined)open('Chuẩn bị '+names[selected].toLowerCase(),'<p>Trồng từ hạt giống ở Vườn nhà. Runtime sẽ nối tới đúng giống và điều kiện mở đang có.</p><p>Chỉ dẫn đường, không tự mua hoặc gieo.</p>',null);
 if(d.rules!==undefined)open('Quà của cả làng','<p>Góp từ <strong>3 món</strong> và cả làng hoàn thành mới có thưởng.</p><p>Xu theo giá trị đã góp · 12 XP · 1 phiếu trang trí.</p><p><strong>Hàng đã góp không hoàn lại khi hết hạn.</strong></p>',null);
 if(d.people!==undefined)open('Người cùng góp','<p>Cô Lan · 16 món</p><p>Chú Bình · 5 món</p><p>Bạn · '+mine+' món</p>',null);
 if(d.donate!==undefined){const max=Math.min(stock[selected],required[selected]-delivered[selected]);open('Góp '+names[selected].toLowerCase(),'<label>Số lượng · tối đa '+max+'<input id="qty" type="number" min="1" max="'+max+'" value="1"></label><p>Góp từ 3 món và làng hoàn thành mới có thưởng. <strong>Hàng không hoàn lại nếu hết hạn.</strong></p><p id="error" role="alert"></p>',()=>{const n=Number($('#qty').value);if(!Number.isSafeInteger(n)||n<1||n>max){$('#error').textContent='Chọn số nguyên từ 1 đến '+max+'.';return}stock[selected]-=n;delivered[selected]+=n;mine+=n;$('#dialog').close();render();notify('Đã góp mô phỏng · Không trừ kho thật')})}
 if(d.move!==undefined)open('Chuyển chuồng','<p>Runtime liệt kê chuồng còn chỗ và yêu cầu xác nhận. Mẫu này không chuyển vật nuôi thật.</p>',null);
 if(d.sell!==undefined)open('Bán sống vật nuôi?','<p>Giá thật sẽ hiện ở runtime. <strong>Vật nuôi rời chuồng và sản phẩm chưa thu sẽ mất.</strong></p>',()=>{$('#dialog').close();notify('Chỉ mô phỏng, không bán vật nuôi thật')});
});render();
</script></body></html>
