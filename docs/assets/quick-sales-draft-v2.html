<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phác thảo Bán nhanh · Khay nông sản</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e4d4;color:#493e2a;font:13px system-ui,sans-serif}header{max-width:1000px;margin:24px auto 12px;padding:0 16px}header h1{font-size:20px;margin:0 0 6px}header p{line-height:1.6;margin:0;color:#74664e}.stage{max-width:1000px;margin:auto;display:grid;grid-template-columns:1fr 304px;gap:14px;padding:16px}.scene{border:3px solid #665437;border-radius:10px;background:#486047 url('market-viewport-v1.png') center/cover;min-height:460px}.book{background:#e9ddba;border:2px solid #85704b;box-shadow:inset 0 0 0 2px #fff2cd,0 3px 0 #695335;border-radius:9px;padding:9px;display:flex;flex-direction:column;gap:8px;min-width:0}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #3c7257;outline-offset:2px}.heading{display:flex;align-items:center;justify-content:space-between;height:28px}.heading strong{font-family:Georgia,serif;font-size:20px;color:#35543f}.heading button{border:0;background:none;font-size:12px}.tabs{display:flex;gap:4px;border-bottom:1px solid #baa578;padding-bottom:7px}.tabs span{flex:1;text-align:center;font-size:11px;padding:5px 0}.tabs .active{border-radius:4px;background:#365641;color:#fff5dc}.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.slot{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 3px 5px;border:1px solid #baa476;border-radius:5px;background:#f6edcf;box-shadow:inset 0 1px #fff9e9}.slot[aria-pressed=true]{border:2px solid #54744c;padding:6px 2px 4px;background:#e4e7bc;box-shadow:inset 0 0 0 1px #fff5cc}.slot[aria-pressed=true]:after{content:'✓';position:absolute;left:3px;top:2px;color:#426342;font-size:11px;font-weight:bold}.art{width:40px;height:40px;display:grid;place-items:center}.sprite{width:24px;height:24px;image-rendering:pixelated;background-repeat:no-repeat;transform:scale(1.666667)}.name{font-size:11px;line-height:14px;min-height:28px;font-weight:650;overflow-wrap:anywhere;width:100%;text-align:center}.qty{position:absolute;top:3px;right:3px;background:#526d45;color:#fff9df;font-size:10px;font-weight:700;border-radius:4px;padding:1px 4px;box-shadow:0 1px #fff7d2}.pager{display:flex;justify-content:center;align-items:center;gap:14px;font-size:11px;height:28px}.pager button{border:1px solid #b69b64;background:#f6e7c3;border-radius:5px;width:28px;height:28px}.pager button:disabled{opacity:.4}.trade{border-top:1px solid #baa578;padding-top:9px;display:grid;gap:7px}.selected{display:flex;align-items:center;justify-content:space-between;gap:5px}.selected strong{font-size:12px}.price{font-size:11px;color:#796039;white-space:nowrap}.sell-row{display:flex;gap:6px;align-items:center}.stepper{display:flex;align-items:center;gap:0;background:#fff4d7;border:1px solid #ad9663;border-radius:5px;height:34px}.stepper button{width:29px;height:32px;border:0;background:none;font-size:18px}.stepper output{min-width:23px;text-align:center;font-weight:bold}.sell{flex:1;border:1px solid #2c4c35;background:#3e6348;color:#fff5d8;border-radius:5px;height:34px;font-size:12px;font-weight:700;box-shadow:0 2px #29422f}.subrow{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#746247}.all{border:0;background:none;color:#6d522b;text-decoration:underline;font-size:11px;padding:2px 0}.notice{font-size:11px;color:#435f3c;min-height:15px}.search{display:none;width:100%;padding:6px;background:#fff5dc;border:1px solid #b7a275;border-radius:4px;font:inherit}.search.open{display:block}
@media(max-height:600px) and (orientation:landscape){header{display:none}.stage{padding:4px;gap:7px;height:100dvh;grid-template-columns:1fr 304px}.scene{min-height:0}.book{padding:6px;gap:4px}.heading{height:24px}.heading strong{font-size:17px}.tabs{padding-bottom:4px}.tabs span{padding:3px 0}.slot{padding:4px 2px 3px;gap:1px}.slot[aria-pressed=true]{padding:3px 1px 2px}.art{height:34px;width:36px}.sprite{transform:scale(1.333333)}.name{font-size:10px;line-height:12px;min-height:24px}.qty{font-size:9px;padding:1px 3px}.pager{height:24px}.pager button{height:24px}.trade{padding-top:5px;gap:4px}.notice{display:none}.stepper,.sell{height:30px}.stepper button{height:28px}.subrow{line-height:13px}.selected strong{font-size:11px}.price{font-size:10px}}
@media(orientation:landscape) and (max-height:340px){.book{gap:2px}.trade{gap:3px}.tabs{padding-bottom:2px}}</style><header><h1>Bán nhanh — phác thảo khay nông sản</h1><p>6 món trong khung 304px. Chọn một món rồi dùng thanh bán chung bên dưới. Dữ liệu mô phỏng, không tác động game.</p></header><main class="stage"><div class="scene" aria-label="Bối cảnh chợ hiện có"></div><section class="book" aria-label="Phác thảo Bán nhanh"><div class="heading"><strong>Bán nhanh</strong><button id="search-toggle">Tìm món ⌕</button></div><nav class="tabs"><span>Đơn làng</span><span>Sạp</span><span>Vật tư</span><span class="active">Bán nhanh</span></nav><input class="search" placeholder="Tìm nông sản…" aria-label="Tìm nông sản"><div class="slots"></div><div class="pager"><button disabled aria-label="Trang trước">‹</button><span>1 / 1</span><button disabled aria-label="Trang sau">›</button></div><div class="trade"><div class="selected"><strong id="selected"></strong><span class="price"></span></div><div class="sell-row"><div class="stepper"><button id="minus" aria-label="Giảm số lượng">−</button><output>1</output><button id="plus" aria-label="Tăng số lượng">+</button></div><button class="sell"></button></div><div class="subrow"><span id="owned"></span><button class="all">Bán hết món này</button></div></div><div class="notice" role="status"></div></section></main><script>
const items=[['Lúa mì',24,6,0,0],['Cà rốt',12,10,0,24],['Bắp',8,15,0,48],['Cà chua',16,18,1,0],['Hướng dương',6,23,1,24],['Dâu chất lượng cao',9,34,1,48]];let selected=3,qty=1;const $=s=>document.querySelector(s);function render(){const search=$('.search').value?.toLocaleLowerCase('vi')||'';$('.slots').innerHTML=items.map((i,n)=>i[0].toLocaleLowerCase('vi').includes(search)?`<button class="slot" data-index="${n}" aria-pressed="${selected===n}" aria-label="${i[0]}, trong kho ${i[1]}"><span class="qty">${i[1]}</span><span class="art"><span class="sprite" style="background-image:url('../../public/pixel/${i[3]?'crop-stages-v2.png':'vertical-slice-v2-hd.png'}');background-size:${i[3]?'96px 216px':'384px 128px'};background-position:-${i[3]?72:168}px -${i[4]}px"></span></span><span class="name">${i[0]}</span></button>`:'').join('');const i=items[selected];$('#selected').textContent=i[0];$('.price').textContent=i[2]+' xu/món';$('#owned').textContent='Trong kho: '+i[1]+' món';$('output').textContent=qty;$('.sell').textContent='Bán · '+qty*i[2]+' xu';$('#minus').disabled=qty<=1;$('#plus').disabled=qty>=i[1];}$('.slots').onclick=e=>{const b=e.target.closest('[data-index]');if(b){selected=+b.dataset.index;qty=1;render()}};$('#minus').onclick=()=>{qty=Math.max(1,qty-1);render()};$('#plus').onclick=()=>{qty=Math.min(items[selected][1],qty+1);render()};$('.sell').onclick=()=>$('.notice').textContent='Mô phỏng: bán '+qty+' '+items[selected][0].toLowerCase()+'.';$('.all').onclick=()=>{qty=items[selected][1];render();$('.notice').textContent='Mô phỏng: bước tiếp theo là xác nhận bán hết.'};$('#search-toggle').onclick=()=>{$('.search').classList.toggle('open');if($('.search').classList.contains('open'))$('.search').focus()};$('.search').oninput=render;render();
</script></html>
