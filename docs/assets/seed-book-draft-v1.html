<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Phác thảo · Sổ giống ba miền</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e3d3;color:#403523;font:14px system-ui}button{font:inherit;color:inherit;cursor:pointer;min-height:36px}button:focus-visible{outline:3px solid #a64e25;outline-offset:2px}button:disabled{opacity:.4;cursor:default}.notice{margin:12px auto;max-width:980px;padding:8px 12px;font-size:12px}.stage{max-width:980px;margin:auto;display:grid;grid-template-columns:1fr 340px;gap:14px;padding:12px}.scene{background:linear-gradient(#243c231f,#243c232f),url('../../public/pixel/scene-background-homestead-v1.png') center/cover;min-height:440px;border:5px solid #665037;border-radius:16px;display:flex;align-items:end;padding:20px}.scene p{background:#f5ead2ed;padding:14px;border-radius:8px;line-height:1.6}.book{background:#f2e6c9;border:5px solid #795a36;border-radius:14px;box-shadow:inset 0 0 0 2px #c6a46e,0 6px 15px #50381926;padding:12px;display:flex;flex-direction:column;gap:9px}h1{font: bold 24px Georgia;margin:0}small{color:#6a604c;font-size:12px}.tabs{display:flex;gap:4px}.tabs button{flex:1;border:1px solid #bba071;border-radius:7px;background:#e5d4ad;font-size:12px}.tabs .selected,.primary{background:#365640;color:#fff3d9;border-color:#365640}.summary{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid #c8b388}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.card{position:relative;min-width:0;border:1px solid #baa074;background:#fbf0d5;border-radius:8px;padding:6px 3px;text-align:center;display:grid;justify-items:center;gap:4px}.card strong{font-size:12px;min-height:30px;display:flex;align-items:center;justify-content:center}.card canvas{width:48px;height:48px;image-rendering:pixelated}.card.locked canvas{filter:grayscale(.65);opacity:.65}.tag{font-size:10px;padding:3px 5px;border-radius:4px;background:#e5d9bf}.tag.done{background:#d3e2bf;color:#304c2b}.pager{display:flex;justify-content:center;gap:16px;align-items:center;margin-top:auto}.pager button{border:1px solid #a98a58;background:#e3cfa3;border-radius:6px}.foot{font-size:11px;color:#70634e;margin:0}dialog{width:min(360px,calc(100vw - 24px));max-height:calc(100dvh - 24px);border:4px solid #795a36;border-radius:12px;background:#f4e8cc;color:#403523;padding:16px;overflow:auto;scrollbar-color:#795a36 #dfcfab;scrollbar-width:auto}dialog::backdrop{background:#1e2b2380}dialog h2{margin:0 0 8px;font: bold 23px Georgia}dialog p{line-height:1.55}.close{float:right}dialog button{border-radius:6px;border:1px solid #aa8e5b;padding:6px 12px}dt{font-weight:bold;margin-top:10px}dd{margin:4px 0;font-size:13px}.stamp{display:inline-block;border:2px solid #547047;color:#385634;padding:5px;transform:rotate(-4deg)}
@media(max-width:700px){.stage{grid-template-columns:1fr;max-width:380px}.scene{display:none}.notice{max-width:380px}.book{min-height:430px}}@media(max-height:500px) and (orientation:landscape){.notice{margin:3px auto;padding:2px 12px}.stage{max-width:960px;grid-template-columns:1fr 340px;padding:4px 12px;gap:10px}.scene{display:flex;min-height:290px}.book{min-height:0;padding:8px;gap:5px}h1{font-size:20px}.card canvas{width:36px;height:36px}.card strong{min-height:25px;font-size:11px}.card{gap:2px;padding:3px}.tabs button{min-height:30px}.summary{padding:2px 0}.pager button{min-height:30px}.foot{font-size:10px}}
@media(max-height:500px) and (orientation:landscape){.stage{height:calc(100dvh - 28px)}.scene{min-height:0}.book{gap:4px;padding:6px}.card canvas{width:30px;height:30px}.card strong{min-height:18px}.tag{font-size:9px;padding:2px 4px}.foot{font-size:9px}.grid{align-content:center}.scene p{font-size:12px}}@media(max-height:340px) and (orientation:landscape){.notice{display:none}.stage{height:100dvh}.book>small,.foot{display:none}.card canvas{width:26px;height:26px}.book{gap:3px}}
</style>
<p class="notice">PHÁC THẢO V1 · Dữ liệu trạng thái minh họa, không đọc hoặc sửa save · Click giống để xem chi tiết.</p>
<main class="stage"><section class="scene"><p><b>Sổ giống ba miền</b><br>Một cuốn sổ khám phá trong bảng Công cụ.<br>Giữ bản đồ và lối chơi hiện có.</p></section><section class="book"><small>NÔNG TRẠI · SỔ GIỐNG</small><h1>Hương vườn ba miền</h1><nav class="tabs" aria-label="Chương"><button data-region="0">Vườn Bắc</button><button data-region="1">Miền Trung</button><button data-region="2">Vườn Nam</button></nav><div class="summary"><span id="chapter"></span><b id="count"></b></div><div class="grid" id="grid"></div><div class="pager"><button id="prev" aria-label="Trang trước">◀</button><span id="page"></span><button id="next" aria-label="Trang sau">▶</button></div><p class="foot">Chương khám phá, không giới hạn nơi trồng. Không có thưởng mới.</p></section></main>
<dialog id="detail"><button class="close" id="close" aria-label="Đóng chi tiết">✕</button><div id="copy"></div></dialog>
<script type="module">
import {crops,goods,cropRequirement} from '../../public/game.mjs';
import {cropFrame} from '../../public/pixel/crop-layout.mjs';
const chapters=[['Vườn Bắc',['wheat','carrot','corn','tomato','pumpkin','tea','blackRice','truffle']],['Miền Trung',['sweetPotato','peanut','sunflower']],['Vườn Nam',['lotus','coffee','dragonfruit','strawberry','grape']]];
const farm={xp:150,workshop:1};let region=0,page=0;
const recorded=new Set(['wheat','carrot','corn']);
const $=s=>document.querySelector(s),cache=new Map();
async function draw(canvas,key){const f=cropFrame(key,3);if(!f||f.procedural)return;let img=cache.get(f.source);if(!img){img=new Image();img.src='../../public'+f.source;cache.set(f.source,img)}try{await img.decode();const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(img,f.x,f.y,f.width??48,f.height??48,0,0,48,48)}catch{canvas.setAttribute('aria-label',goods[key].name)}}
function render(){const [title,keys]=chapters[region],pages=Math.ceil(keys.length/6);$('#chapter').textContent=title;$('#count').textContent='Đã ghi nhận '+keys.filter(k=>recorded.has(k)).length+'/'+keys.length;$('#page').textContent=(page+1)+' / '+pages;$('#prev').disabled=page===0;$('#next').disabled=page===pages-1;document.querySelectorAll('[data-region]').forEach(b=>{b.classList.toggle('selected',+b.dataset.region===region);b.setAttribute('aria-pressed',+b.dataset.region===region)});$('#grid').replaceChildren();for(const key of keys.slice(page*6,page*6+6)){const lock=cropRequirement(farm,key),done=recorded.has(key),b=document.createElement('button');b.className='card'+(lock?' locked':'');const canvas=document.createElement('canvas');canvas.width=canvas.height=48;canvas.setAttribute('aria-hidden','true');const name=document.createElement('strong');name.textContent=goods[key].name;const tag=document.createElement('span');tag.className='tag'+(done?' done':'');tag.textContent=lock?'▣ Chưa mở':done?'✓ Đã ghi nhận':'Chưa ghi nhận';b.append(canvas,name,tag);b.onclick=()=>open(key,lock,done);$('#grid').append(b);draw(canvas,key)}}
function open(key,lock,done){const c=crops[key];$('#copy').replaceChildren();const h=document.createElement('h2');h.textContent=goods[key].name;const status=document.createElement('p');status.textContent=done?'✓ Đã ghi nhận lần thu đầu':lock?'Chưa mở giống':'Đã mở · Chưa ghi nhận';if(done)status.className='stamp';const dl=document.createElement('dl');for(const [label,text] of [['Điều kiện',lock||'Đã đủ điều kiện hiện tại'],['Thời gian cơ sở',Math.round(c.time/60)+' phút · Có thể đổi theo thời tiết/chăm sóc'],['Sản lượng cơ sở',c.yield+' · Chưa tính tác động vụ'],['Ghi nhận','Thu thành công giống này sau khi Sổ giống được cập nhật. Không suy ra lịch sử từ đồ trong kho.']]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=text;dl.append(dt,dd)}const button=document.createElement('button');button.className='primary';button.textContent=lock?'Xem điều kiện mở':'Tìm hạt giống';button.onclick=()=>{$('#demo').textContent='Bản production sẽ mở đúng bảng hiện có; phác thảo không mua/gieo hay đổi scene.'};const note=document.createElement('p');note.id='demo';note.className='foot';$('#copy').append(h,status,dl,button,note);$('#detail').showModal()}
document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{region=+b.dataset.region;page=0;render()});$('#prev').onclick=()=>{page--;render()};$('#next').onclick=()=>{page++;render()};$('#close').onclick=()=>$('#detail').close();render();
</script></html>
