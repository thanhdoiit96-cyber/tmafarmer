<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phác thảo V3 · Đơn hàng & vật nuôi</title><link rel="stylesheet" href="../../public/style.css"><style>
body{margin:0;background:#eae5d6;color:#35452e;padding:14px;font-family:'Be Vietnam Pro',system-ui,sans-serif}.review,main{max-width:1080px;margin:auto}.review{font-size:11px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.review span{flex:1;min-width:200px}.review button{min-height:34px;font-size:11px}main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;align-items:start}.scene{position:relative;border:4px solid #52684b;border-radius:12px;overflow:hidden;background:#52684b}.scene img{width:100%;display:block;image-rendering:pixelated}.scene p{font-size:11px;margin:0;padding:8px;color:#fff0c8}.sheet{border:2px solid #8a6b40;border-radius:10px;background:#f8f0d9;box-shadow:0 3px 0 #b59a6b;overflow:hidden;min-width:0}.wood{background:linear-gradient(#886740,#745633);border-bottom:2px solid #624829;padding:10px 12px;color:#fff2cf;display:flex;justify-content:space-between;align-items:center;gap:8px}.wood h1{font:700 20px var(--display);margin:0;color:inherit}.wood small{font-size:10px;color:#f2dbad}.sheet-body{padding:10px}.section-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#716245;margin:1px 0 9px}.filters{display:flex;gap:4px;margin-bottom:8px}.filters button{flex:1;min-height:32px;font-size:10px;padding:4px}.rows{border:1px solid #ccb98a;border-radius:7px;overflow:hidden}.animal-row{display:grid;grid-template-columns:56px minmax(0,1fr) 75px;align-items:center;gap:5px;min-height:76px;padding:5px 7px;background:#fbf4e1;border-bottom:1px solid #ddcfac}.animal-row:last-child{border:0}.animal-row[data-state="ready"]{background:#eef0d4}.portrait{width:56px;height:48px;background-image:url('../../public/pixel/livestock-v2.png');background-repeat:no-repeat;image-rendering:pixelated;background-position:var(--sprite) 0}.identity{border:0;background:none;padding:3px 0;text-align:left;color:inherit;cursor:pointer;min-width:0}.identity strong{display:block;font-size:12px}.identity small{display:block;font-size:10px;color:#7b694a;margin-top:3px}.identity .hint{font-size:9px;color:#72805d}.row-action{font-size:10px;min-height:34px;padding:5px 6px;white-space:nowrap}.row-wait{font-size:11px;text-align:right;color:#697b4d}.row-wait small{display:block;font-size:9px;color:#877657;margin-top:3px}.footer{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:9px;font-size:10px;color:#756447}.footer .btn{min-height:30px;padding:4px 10px}.subtle-link{background:none;border:0;text-decoration:underline;text-underline-offset:3px;color:#627447;cursor:pointer;font:inherit;padding:8px 0}.order-tabs{display:flex;border-bottom:1px solid #cbb485;background:#e8d9b6}.order-tabs button{flex:1;border:0;border-bottom:3px solid transparent;padding:9px 4px;font-size:11px;font-weight:700;color:#74613c;background:none;cursor:pointer}.order-tabs button[aria-pressed="true"]{border-color:#54714c;color:#354f35;background:#f8f0d9}.order-title{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}.order-title h2{font:700 18px var(--display);margin:0}.order-title small{font-size:10px;color:#7b6a4a}.order-note{font-size:10px;color:#75654b;margin:5px 0 12px}.goods-list{border-top:1px solid #d9c8a0}.goods-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:6px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid #d9c8a0;padding:10px 6px;background:transparent;color:inherit;cursor:pointer}.goods-row[aria-pressed="true"]{background:#e8edcf;box-shadow:inset 3px 0 #638353}.crop{width:24px;height:24px;background:url('../../public/pixel/vertical-slice-v2-hd.png') -168px var(--crop)/384px 128px;image-rendering:pixelated}.goods-row strong{display:block;font-size:12px}.goods-row small{display:block;font-size:10px;color:#817153;margin-top:3px}.goods-row b{font-size:11px;color:#6b7f45}.goods-row b small{font-weight:400;text-align:right}.selected{margin-top:9px;border:1px solid #c3ac79;border-radius:7px;background:#f3e7c7;padding:9px}.selected-title{display:flex;align-items:center;justify-content:space-between;font-size:11px;margin-bottom:7px}.selected .actions{display:flex;gap:6px}.selected .btn{min-height:34px;font-size:10px;padding:5px 8px}.selected .primary{flex:1}.selected .care-note{font-size:10px;margin:6px 0 0}.milestone{margin-top:12px;padding-top:8px;border-top:1px dashed #c1ad82;font-size:10px;color:#766545;display:flex;justify-content:space-between;gap:8px}.milestone strong{color:#526b3b}.tiny{font-size:10px;color:#7d6a4b}.notice{font-size:11px;min-height:16px;color:#536f3e;margin:8px 0 0}dialog{width:calc(100% - 32px);max-width:390px;border:2px solid #917041;border-radius:10px;background:#fbf3dd;color:#35452e;padding:16px;box-sizing:border-box}dialog h2{font-size:21px;margin:0 0 10px}dialog p{font-size:12px}dialog .actions{display:flex;gap:7px;margin-top:12px}dialog .btn{font-size:11px}dialog input{width:100%;box-sizing:border-box;margin:8px 0}.detail-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-block:1px solid #d9c8a0;padding:12px 0;margin:12px 0}.detail-stats small{display:block;font-size:10px;color:#7e6b4c}.detail-stats b{font-size:13px}.badge-status{display:inline-block;font-size:10px;padding:3px 7px;border-radius:4px;background:#e5eacb}.animal-detail-head{display:flex;gap:10px;align-items:center}.animal-detail-head h2{margin:0 0 4px}.animal-detail-head .portrait{transform:scale(1.25);margin:0 8px}dialog details{font-size:11px;margin:10px 0}dialog summary{cursor:pointer}.info-actions{display:flex;justify-content:space-between;gap:7px;border-top:1px solid #d9c8a0;padding-top:10px}.info-actions button{font-size:11px}.review button[aria-pressed="true"]{background:#35563f;color:#fff4d9}.sheet button:focus-visible{outline:2px solid #93703d;outline-offset:-2px}
@media(max-width:900px) and (orientation:landscape){body{padding:7px}.review{margin-bottom:6px}.review span{font-size:9px}main{grid-template-columns:minmax(0,1fr) 300px;gap:8px}.scene{position:sticky;top:7px}.animal-row{min-height:64px}.sheet-body{padding:8px}.wood{padding:8px 10px}.wood h1{font-size:18px}.goods-row{padding-block:8px}}
@media(max-width:580px) and (orientation:portrait){main{grid-template-columns:1fr}.scene{display:none}.sheet{max-width:360px;margin:auto;width:100%}}
</style></head><body><section class="review"><span><b>PHÁC THẢO V3</b> · Chưa đổi game. Dữ liệu mô phỏng.</span><button class="btn subtle" data-view="animals">Chăm sóc vật nuôi</button><button class="btn subtle" data-view="orders">Đơn hàng</button></section><main><section class="scene"><img id="scene" src="coop-viewport-v8.png" alt="Ảnh bối cảnh game hiện có để đối chiếu"><p>Bối cảnh giữ nguyên · Duyệt bố cục bảng bên phải</p></section><section class="sheet"><header class="wood"><h1 id="title"></h1><small id="meta"></small></header><div id="content"></div><p class="notice" id="notice" role="status" aria-live="polite"></p></section></main><dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div><div class="actions"><button class="btn subtle" id="close">Đóng</button><button class="btn primary" id="confirm">Xác nhận</button></div></dialog><script>
const $=s=>document.querySelector(s),animals=[{name:'Cừu',sprite:-56,state:'hungry',copy:'Cần cho ăn',action:'Ăn · 3 phần',product:'1 len',eta:'~3 phút'},{name:'Dê sữa',sprite:0,state:'ready',copy:'Sữa dê đã sẵn sàng',action:'Thu · 3',product:'3 sữa dê',eta:'Sẵn sàng'},{name:'Ngỗng',sprite:-112,state:'growing',copy:'Đang tạo trứng',product:'3 trứng ngỗng',eta:'~12 phút'},{name:'Thỏ',sprite:-168,state:'growing',copy:'Đang lớn',product:'3 thịt thỏ',eta:'~28 phút'}];
let view='animals',filter='all',page=0,order='village',selected=0,pinned=null,quantity=1,confirmAction=null;
const delivered=[10,4,8],required=[16,12,12],stock=[4,1,0],names=['Lúa mì','Cà rốt','Bắp'];let mine=1;
const portrait=a=>'<span class="portrait" style="--sprite:'+a.sprite+'px" aria-hidden="true"></span>';
function open(title,html,action){$('#dialog-body').innerHTML='<h2 id="dialog-title">'+title+'</h2>'+html;confirmAction=action;$('#confirm').hidden=!action;$('#dialog').showModal()}
function render(){
 $('#notice').textContent='';document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));$('#scene').src=view==='animals'?'coop-viewport-v8.png':'market-viewport-v1.png';$('#title').textContent=view==='animals'?'Chuồng chính':'Đơn hàng';$('#meta').textContent=view==='animals'?'8 / 12 chỗ':'Bảng tin làng';
 if(view==='animals'){
 const list=Array.from({length:8},(_,i)=>({...animals[i%4],id:i})).filter(a=>filter==='all'||a.state===filter),size=matchMedia('(max-height:500px) and (orientation:landscape)').matches?3:4,pages=Math.max(1,Math.ceil(list.length/size));page=Math.min(page,pages-1);
 $('#content').innerHTML='<div class="sheet-body"><div class="section-top"><span>2 có thể thu · 2 cần ăn</span><span>Túi: 10 thức ăn</span></div><nav class="filters" aria-label="Lọc vật nuôi">'+[['all','Tất cả'],['ready','Có thể thu'],['hungry','Cần ăn']].map(([id,label])=>'<button class="btn '+(filter===id?'primary':'subtle')+'" data-filter="'+id+'">'+label+'</button>').join('')+'</nav><div class="rows">'+list.slice(page*size,page*size+size).map(a=>'<article class="animal-row" data-state="'+a.state+'">'+portrait(a)+'<button class="identity" data-detail="'+a.id+'" aria-label="Quản lý '+a.name+' '+(a.id+1)+'"><strong>'+a.name+' '+(a.id+1)+'</strong><small>'+a.copy+'</small> </button>'+(a.action?'<button class="btn '+(a.state==='ready'?'primary':'gold')+' row-action" data-care="'+a.id+'">'+a.action+'</button>':'<span class="row-wait">'+a.eta+'<small>Đủ thức ăn</small></span>')+'</article>').join('')+'</div><div class="footer"><button class="btn subtle" data-page="-1" '+(!page?'disabled':'')+' aria-label="Trang trước">‹</button><span>'+(page+1)+' / '+pages+'</span><button class="btn subtle" data-page="1" '+(page===pages-1?'disabled':'')+' aria-label="Trang sau">›</button></div><div class="footer"><button class="subtle-link" data-adopt>＋ Đón thêm vật nuôi</button><span>Chạm tên để quản lý</span></div></div>';
 }else{
 const i=selected,remaining=Math.max(0,required[i]-delivered[i]),max=Math.min(stock[i],remaining);
 $('#content').innerHTML='<nav class="order-tabs" aria-label="Loại đơn"><button data-order="market" aria-pressed="'+(order==='market')+'">Đơn chợ</button><button data-order="village" aria-pressed="'+(order==='village')+'">Góp hàng làng</button></nav><div class="sheet-body">'+(order==='market'?'<div class="order-title"><h2>Giỏ rau sáng</h2><small>18 xu · 4 XP</small></div><p class="order-note">Giao đủ một lần · Người giao trước nhận</p><div class="goods-list"><div class="goods-row"><span class="crop" style="--crop:-24px"></span><strong>Cà rốt</strong><b>1 / 2<small>Trong kho / cần</small></b></div></div><div class="selected"><p class="tiny">Còn thiếu 1 cà rốt</p><button class="btn subtle" data-source="1">Cách có</button></div>':'<div class="order-title"><h2>Giỏ nông sản</h2><small>Còn 30 giờ</small></div><p class="order-note">'+delivered.reduce((a,b)=>a+b,0)+' / 40 món · Cùng cả làng chuẩn bị</p><div class="goods-list">'+names.map((name,j)=>'<button class="goods-row" data-select="'+j+'" aria-pressed="'+(j===i)+'"><span class="crop" style="--crop:-'+j*24+'px" aria-hidden="true"></span><span><strong>'+name+(pinned===j?' · Ghim':'')+'</strong><small>Kho bạn '+stock[j]+'</small></span><b>'+(required[j]-delivered[j]>0?'Thiếu '+(required[j]-delivered[j]):'Đã đủ')+'<small>'+delivered[j]+'/'+required[j]+' đã góp</small></b></button>').join('')+'</div><div class="selected"><div class="selected-title"><strong>'+names[i]+'</strong><span>'+(max?'Góp tối đa '+max:'Chưa có hàng')+'</span></div><div class="actions"><button class="btn primary" data-donate '+(!max?'disabled':'')+'>Góp</button><button class="btn subtle" data-pin>'+(pinned===i?'Bỏ ghim':'Ghim')+'</button><button class="btn subtle" data-source="'+i+'">Cách có</button></div></div><div class="milestone"><span>Bạn góp '+mine+' món</span><strong>'+(mine<3?'Còn '+(3-mine)+' để đủ mốc thưởng':'Đủ mốc cá nhân')+'</strong></div><div class="footer"><button class="subtle-link" data-rules>Điều kiện &amp; phần thưởng</button><button class="subtle-link" data-people>Người cùng góp</button></div>')+'</div>';
 }
}
$('#close').onclick=()=>$('#dialog').close();$('#confirm').onclick=()=>{if(confirmAction)confirmAction()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.view){view=d.view;render()}if(d.filter){filter=d.filter;page=0;render()}if(d.page){page+=Number(d.page);render()}if(d.order){order=d.order;render()}if(d.select!==undefined){selected=Number(d.select);render()}
 if(d.detail!==undefined){const id=Number(d.detail),a=animals[id%4];open('Quản lý '+a.name.toLowerCase(),'<div class="animal-detail-head">'+portrait(a)+'<div><strong>'+a.name+' '+(id+1)+'</strong><p class="badge-status">'+a.copy+'</p></div></div><div class="detail-stats"><div><small>Lứa này</small><b>'+a.product+'</b></div><div><small>'+(a.state==='hungry'?'Sau khi cho ăn':'Thời gian còn')+'</small><b>'+a.eta+'</b></div></div><details><summary>Thức ăn &amp; sức sản xuất</summary><p>Mỗi lần: '+(a.name==='Cừu'?3:2)+' phần. Ước tính theo thời tiết hiện tại, đủ ăn liên tục. Phần runtime sẽ lấy đúng giá trị engine cho từng con.</p></details><div class="info-actions"><button class="btn subtle" data-move>Chuyển chuồng</button><button class="btn subtle" data-sell>Bán sống…</button></div>',null)}
 if(d.care!==undefined){$('#notice').textContent='Mô phỏng thao tác '+(animals[Number(d.care)%4].state==='ready'?'thu hoạch':'cho ăn')+'; không tiêu tài sản thật.'}
 if(d.pin!==undefined){pinned=pinned===selected?null:selected;render();$('#notice').textContent='Mô phỏng ghim trong Việc cần làm.'}
 if(d.source!==undefined){open('Cách có '+names[Number(d.source)].toLowerCase(),'<p>Trồng từ hạt giống ở Vườn nhà.</p><p>Runtime nối thẳng tới giống và điều kiện mở hiện có. Chỉ điều hướng, không tự mua/gieo.</p>',null)}
 if(d.rules!==undefined){open('Góp hàng cùng làng','<p>Góp từ 3 món và cả làng hoàn thành mới nhận thưởng theo luật hiện có.</p><p><strong>Hàng đã góp không hoàn lại khi hết hạn.</strong></p><p>Đợt kéo dài 48 giờ thực. Thưởng theo giá trị đã góp, 12 XP và phiếu trang trí; không thay luật trong lần thiết kế này.</p>',null)}
 if(d.people!==undefined)open('Người cùng góp','<p>Cô Lan · 16 món</p><p>Chú Bình · 5 món</p><p>Bạn · '+mine+' món</p>',null);
 if(d.donate!==undefined){const max=Math.min(stock[selected],required[selected]-delivered[selected]);open('Góp '+names[selected].toLowerCase(),'<p>Chọn từ 1 đến '+max+' món.</p><input id="qty" aria-label="Số lượng góp" type="number" min="1" max="'+max+'" value="1"><p>Góp từ 3 món và cả làng hoàn thành mới có thưởng. Hàng không hoàn lại nếu hết hạn.</p><p id="error" role="alert"></p>',()=>{const n=Number($('#qty').value);if(!Number.isSafeInteger(n)||n<1||n>max){$('#error').textContent='Số lượng không hợp lệ.';return}stock[selected]-=n;delivered[selected]+=n;mine+=n;$('#dialog').close();render()})}
 if(d.move!==undefined){$('#dialog').close();open('Chuyển chuồng','<p>Runtime chỉ liệt kê chuồng có thể chuyển tới, kèm sức chứa còn trống. Bản mẫu chưa thực hiện chuyển.</p>',null)}
 if(d.sell!==undefined){$('#dialog').close();open('Bán sống vật nuôi?','<p>Runtime hiển thị giá thật tại đây trước khi xác nhận.</p><p><strong>Vật nuôi rời chuồng; sản phẩm chưa thu sẽ mất.</strong></p>',()=>{$('#dialog').close();$('#notice').textContent='Chỉ mô phỏng, chưa bán vật nuôi.'})}
 if(d.adopt!==undefined)open('Đón thêm vật nuôi','<p>Dùng lại bộ chọn vật nuôi hiện có; không gắn bộ chọn dài vào bên dưới danh sách chăm sóc.</p>',null);
});window.addEventListener('resize',render);render();
</script></body></html>
