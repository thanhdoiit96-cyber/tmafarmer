<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hàng xóm và Ao làng — phác thảo song song</title><link rel="stylesheet" href="../../public/style.css">
<style>
body{background:#f4efe1;color:#354c36;font-family:system-ui,sans-serif;min-width:300px;padding:9px}.review,.mock{max-width:1050px;margin:auto}.review{font-size:11px;margin-bottom:8px}.review strong{display:block;margin-bottom:6px}.toolbar,.actions,.tabs{display:flex;gap:5px;flex-wrap:wrap}.review .btn{min-height:30px;padding:4px 8px;font-size:10px}.mock{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:9px}.scene{position:relative;align-self:start;border:4px solid #967448;border-radius:9px;overflow:hidden;aspect-ratio:5/3;background-color:#81915b}.plate{position:absolute;inset:0;background:url('../../public/pixel/scene-background-neighbors-v1.png') center/cover;filter:saturate(.9) brightness(.98);image-rendering:pixelated}.scene[data-page="lake"] .plate{background-image:url('../../public/pixel/scene-backgrounds-environments-v1.png');background-size:202.5% 202.291667%;background-position:left bottom}.scene-label{position:absolute;left:8px;top:8px;background:#f5e8c9;padding:5px 8px;border-radius:6px;font-size:11px}.spot{position:absolute;font-size:10px!important;min-height:30px!important;padding:4px 7px!important;background:#f4e4bf!important;color:#4f5936!important}.dock{left:17%;top:60%}.shore{left:44%;top:83%}.scene:not([data-page="lake"]) .spot{display:none}.sheet{background:#f4e8cc;border:1px solid #c5ab7e;border-radius:9px;padding:10px;min-width:0}.nav{font-size:11px;border-bottom:1px solid #d6c29b;padding:3px 0 8px}.sheet h2{font-size:20px;margin:9px 0 6px}.sheet h3{font-size:12px;margin:0 0 5px}.sheet p{font-size:11px;line-height:1.5;margin:5px 0}.sheet .btn{font-size:11px;min-height:32px;padding:4px 8px}.tabs{margin:7px 0}.tabs .btn{flex:1;min-width:0;padding:5px;font-size:10px}.mini-card{padding:8px;border:1px solid #b99a67;border-radius:7px;background:#f0e0bc;margin:7px 0}.action-grid{display:grid;grid-template-columns:1fr;gap:5px}.social-action{display:grid;grid-template-columns:1fr auto;gap:4px;align-items:center;border:1px solid #c9b38a;border-radius:6px;padding:7px;background:#f8edcf}.social-action h3{font-size:11px;margin:0 0 3px}.social-action p{font-size:10px;margin:0;color:#756141}.badge-line{display:flex;gap:5px;flex-wrap:wrap;font-size:10px;margin:7px 0}.tag{background:#dbe4c5;padding:3px 6px;border-radius:4px}.tag.warm{background:#e9d2ab}.fine{font-size:10px!important;color:#75613e}.sheet .actions{margin-top:7px}.notice{font-size:11px;line-height:1.5;min-height:18px;margin:8px 0 0;color:#466340}.exchange{display:grid;grid-template-columns:1fr 1fr;gap:5px}.exchange .btn{font-size:10px}.fish-book{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.fish-book article{padding:7px 4px;border:1px solid #c6af82;border-radius:6px;background:#f8edcf;font-size:10px}.fish-book strong,.fish-book small{display:block;margin:3px 0}.fish-book [data-empty="true"]{opacity:.65}.sheet details{margin-top:8px;padding-top:5px;border-top:1px solid #c9b38a}.sheet summary{font-size:10px;cursor:pointer;padding:5px 0}dialog{width:min(440px,calc(100vw - 20px));padding:15px;border:2px solid #b09360;border-radius:10px;background:#fff7e5;color:#354c36}dialog::backdrop{background:#26332288}dialog h2{font-size:19px;margin:0 0 9px}dialog p{font-size:12px;line-height:1.5}dialog .btn{font-size:12px;min-height:36px}
@media(max-width:760px){body{padding:7px}.mock{grid-template-columns:minmax(0,1fr) 285px;gap:6px}.sheet{padding:8px}.scene{position:sticky;top:7px}.sheet h2{font-size:18px}.scene-label{max-width:calc(100% - 16px);font-size:10px}.spot{font-size:9px!important}.shore{left:38%}}
@media(max-width:580px) and (orientation:portrait){.mock{grid-template-columns:1fr}.scene{position:relative;max-height:185px}.scene .plate{background-position:center}.scene[data-page="lake"] .plate{background-position:left bottom}}
</style></head><body>
<section class="review"><strong>PHÁC THẢO · Giữ lấy trộm, thêm giúp và nghịch cùng một làng · Không lưu vào game</strong><div class="toolbar"><button class="btn subtle" id="review-visit">Hàng xóm</button><button class="btn subtle" id="review-lake">Ao làng</button><button class="btn subtle" id="review-consent">Chủ bật/tắt nhận nghịch</button><button class="btn subtle" id="review-expire">Mô phỏng hết sâu nghịch</button><button class="btn subtle" id="review-job">Mô phỏng xong việc ven ao</button><button class="btn subtle" id="review-reset">Làm lại mẫu</button><select id="review-case" aria-label="Tình huống duyệt"><option value="base">Mẫu cấp 3</option><option value="beginner">Người mới cấp 1</option><option value="full">Ví dấu và lọ đầy</option><option value="book">Sổ cá đủ bộ</option></select></div></section>
<main class="mock"><section class="scene" id="scene" data-page="visit" aria-label="Bối cảnh hiện có, chỉ minh họa vị trí"><div class="plate"></div><span class="scene-label" id="scene-label">Ghé vườn Bắp · Cùng làng</span><button class="btn spot dock" data-lake-tab="fishing">Bến câu</button><button class="btn spot shore" data-lake-tab="shore">Việc ven ao</button></section><section class="sheet"><nav class="nav" id="nav"></nav><div id="content"></div><p class="notice" id="notice" role="status" aria-live="polite"></p></section></main>
<dialog id="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p id="confirm-copy"></p><div class="actions"><button class="btn subtle" id="cancel">Để sau</button><button class="btn primary" id="accept">Xác nhận</button></div></dialog>
<script>
const content=document.querySelector('#content'),notice=document.querySelector('#notice'),dialog=document.querySelector('#confirm');
let page='visit',tab='fishing',plot='ripe',pending='',model;
const button=(id,text,disabled=false)=>'<button class="btn '+(disabled?'subtle':'primary')+'" id="'+id+'"'+(disabled?' disabled':'')+'>'+text+'</button>';
function reset(){document.querySelector('#review-case').value='base';model={rank:3,allowed:true,taken:false,helped:false,wet:false,prankActive:false,immune:false,pranks:0,jars:1,marks:0,job:'idle',exchanged:false,feed:3,fishUsed:0,fishCooldown:false,catches:{minnow:0,tilapia:0,goldenCarp:0},bookClaimed:false,vouchers:0};page='visit';tab='fishing';plot='ripe';notice.textContent='';render();}
function prankBlock(){return model.rank<3?'Cần cấp nông trại 3':plot==='ripe'?'Cây chín, không thả sâu':!model.allowed?'Chủ chưa nhận nghịch':model.prankActive?'Đang có sâu nghịch':model.immune?'Đang miễn nhận 30 phút':model.pranks>=2?'Hết lượt hôm nay':!model.jars?'Cần 1 lọ sâu nghịch':'';}
function render(){
 document.querySelector('#scene').dataset.page=page;document.querySelector('#scene-label').textContent=page==='lake'?'Ao làng · Bến câu và bờ ao':'Ghé vườn Bắp · Cùng làng';document.querySelector('#nav').textContent=page==='lake'?'Ao làng › '+({fishing:'Bến câu',shore:'Việc ven ao',book:'Sổ cá'}[tab]):'Hàng xóm › Vườn Bắp';
 if(page==='visit'){
 const blocked=prankBlock();
 content.innerHTML='<h2>Vườn Bắp</h2><p class="fine">Bản mẫu: bạn cấp '+model.rank+', chủ cấp 3, cổng mở.</p><div class="tabs"><button class="btn '+(plot==='ripe'?'primary':'subtle')+'" data-plot="ripe">Ô 1 · Bắp chín</button><button class="btn '+(plot==='growing'?'primary':'subtle')+'" data-plot="growing">Ô 2 · Cà phê đang lớn</button></div><div class="badge-line"><span class="tag">Sâu tự nhiên: 12%</span><span class="tag '+(model.prankActive?'warm':'')+'">'+(model.prankActive?'Sâu nghịch · -10% tốc độ':model.immune?'Miễn nhận nghịch 30 phút':model.allowed?'Chủ có nhận nghịch vui':'Chủ không nhận nghịch vui')+'</span></div><div class="action-grid"><article class="social-action"><div><h3>Lấy trộm · Luật cũ</h3><p>'+(plot!=='ripe'?'Ô này chưa chín':model.taken?'Đã lấy ở vườn này hôm nay':'Lấy 1 bắp, dùng lượt lấy hiện có')+'</p></div>'+button('take','Lấy 1',plot!=='ripe'||model.taken)+'</article><article class="social-action"><div><h3>Giúp tưới · Lượt riêng</h3><p>'+(plot==='ripe'?'Không cần tưới cây đã chín':model.wet?'Đất đã đủ ẩm':'Đất khô · Dùng chỉ số của bạn')+'</p></div>'+button('help','Giúp',plot==='ripe'||model.wet||model.helped)+'</article><article class="social-action"><div><h3>Nghịch vui · '+model.jars+' lọ</h3><p>'+(blocked||'Một ô · -10% trong tối đa 3 phút')+'</p></div>'+button('prank','Thả sâu',!!blocked)+'</article></div>'+(model.prankActive?'<div class="mini-card"><h3>Sâu nghịch khác sâu tự nhiên</h3><p>Tự hết sau 3 phút; không tăng sâu tự nhiên hoặc mức thiệt hại đã tích lũy.</p>'+button('catch-prank','Bắt sâu nghịch miễn phí')+'</div>':'')+'<details><summary>Lượt giúp và nghịch không thay luật lấy trộm</summary><p class="fine">Giúp: 3 lần/ngày, tối đa 2 cho cùng một chủ. Nghịch: 2 lần/ngày, một lần cho cùng chủ; chủ nhận tối đa 2 từ cả làng. Không có thưởng cho thả/bắt sâu nghịch.</p></details>';
 return;
 }
 const tabs='<div class="tabs">'+[['fishing','Bến câu'],['shore','Việc ven ao'],['book','Sổ cá']].map(([id,name])=>'<button class="btn '+(tab===id?'primary':'subtle')+'" data-lake-tab="'+id+'">'+name+'</button>').join('')+'</div>';
 let body='';
 if(tab==='fishing')body='<div class="mini-card"><h3>Hôm nay nắng nhẹ</h3><p>Cá chép vàng: 3% mỗi lần kéo thành công. Mưa 4%, sương 2%; dông không thả mới.</p><p class="fine">Còn '+(12-model.fishUsed)+'/12 lượt · giữ luật câu hiện tại.</p>'+button('fish',model.fishCooldown?'Đang hồi lượt 45 giây':'Thả câu mẫu',model.fishCooldown||model.fishUsed>=12)+'</div><p class="fine">Bản mẫu cho xem một lần kéo được cá nhỏ; không mô phỏng RNG hay đồng hồ. Mẫu vật vào Sổ cá, không vào kho thật.</p>'+(model.fishCooldown?'<button class="btn subtle" id="review-cooldown">Mô phỏng hết hồi lượt</button>':'');
 if(tab==='shore')body='<div class="badge-line"><span class="tag">'+model.marks+'/6 dấu ven ao</span><span class="tag">'+model.jars+'/2 lọ sâu</span><span class="tag">'+model.feed+' thức ăn ao</span></div><div class="mini-card"><h3>Nhặt rác bờ ao</h3><p>Một việc ngắn khoảng 10 giây. Hoàn thành nhận 2 dấu, tối đa một lần/ngày game.</p>'+button('job',model.job==='done'?'Hôm nay đã làm':model.job==='working'?'Đang làm…':'Bắt đầu',model.job!=='idle'||model.marks>4||model.rank<2)+(model.job==='working'?'<button class="btn subtle" id="cancel-job">Hủy việc</button>':'')+'</div><h3>Đổi 2 dấu · Một gói/ngày</h3><div class="exchange">'+button('exchange-feed','1 thức ăn ao',model.marks<2||model.exchanged)+button('exchange-jar','1 lọ sâu nghịch',model.marks<2||model.exchanged||model.jars>=2||model.rank<3)+'</div><p class="fine">'+(model.rank<2?'Việc ven ao cần cấp nông trại 2. ':model.marks>4?'Ví gần đầy; đổi bớt trước khi nhận 2 dấu. ':'')+(model.exchanged?'Hôm nay đã đổi một gói.':model.marks<2?'Chưa đủ dấu; làm một việc ven ao trước.':'Chọn một gói; không bán dấu hoặc mua thêm bằng xu.')+'</p>';
 if(tab==='book')body='<p>Ghi lần đầu câu thành công tại hồ công cộng; cá mua/nuôi/câu trộm không tính.</p><div class="fish-book">'+[['Cá nhỏ',model.catches.minnow],['Rô phi',model.catches.tilapia],['Cá chép vàng',model.catches.goldenCarp]].map(([name,count])=>'<article data-empty="'+!count+'"><strong>'+name+'</strong><small>'+(count?'Đã ghi nhận · '+count+' lần':'Chưa ghi nhận')+'</small></article>').join('')+'</div><div class="mini-card"><h3>Kỷ niệm bến nước</h3><p>Đủ 3 loài câu công cộng: nhận 1 phiếu trang trí, một lần cho vườn.</p>'+button('book-reward',model.bookClaimed?'Đã nhận phiếu':'Nhận kỷ niệm',model.bookClaimed||!Object.values(model.catches).every(n=>n>0))+'</div><p class="fine">'+model.vouchers+' phiếu trong bản mẫu · Không mất ghi nhận nếu nghỉ chơi.</p>';
 content.innerHTML='<h2>Ao làng</h2>'+tabs+body;
}
function confirm(title,copy,action){pending=action;document.querySelector('#confirm-title').textContent=title;document.querySelector('#confirm-copy').textContent=copy;dialog.showModal();}
function endPrank(){model.prankActive=false;model.immune=true;notice.textContent='Sâu nghịch đã hết; 12% sâu tự nhiên giữ nguyên. Miễn nhận mới 30 phút.';}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.plot){plot=b.dataset.plot;render();return;}
 if(b.dataset.lakeTab){page='lake';tab=b.dataset.lakeTab;render();return;}
 if(b.id==='review-reset'){reset();return;}
 if(b.id==='review-visit'||b.id==='review-lake'){page=b.id==='review-lake'?'lake':'visit';render();return;}
 if(b.id==='review-consent'){model.allowed=!model.allowed;if(!model.allowed&&model.prankActive)endPrank();notice.textContent='Mô phỏng chủ '+(model.allowed?'cho phép':'tắt nhận')+' nghịch. Luật lấy trộm không đổi.';render();return;}
 if(b.id==='review-expire'){if(model.prankActive)endPrank();else notice.textContent='Chưa có sâu nghịch đang chạy.';render();return;}
 if(b.id==='review-job'){if(model.job==='working'&&model.marks<=4&&model.rank>=2){model.job='done';model.marks+=2;notice.textContent='Đã mô phỏng hoàn thành: +2 dấu, không có thưởng thật.';}else notice.textContent='Bắt đầu việc ở Ao làng trước.';render();return;}
 if(b.id==='review-cooldown'){model.fishCooldown=false;render();return;}
 if(b.id==='take')confirm('Lấy 1 bắp?','Vẫn áp dụng lượt lấy, hạn mức vườn/làng và cổng hiện có. Bản mẫu chỉ mô phỏng, không trừ hàng của người chơi.','take');
 else if(b.id==='help')confirm('Giúp tưới ô cà phê?','Dùng chỉ số của bạn, không lấy vật tư của chủ. Không tiêu hoặc trả lại lượt lấy trộm. Không phát thưởng vật phẩm.','help');
 else if(b.id==='prank')confirm('Thả 1 lọ sâu nghịch?','Chủ đã cho phép. Một ô chậm 10%, tự hết sau tối đa 3 phút; không cộng vào sâu tự nhiên. Không được trả lọ nếu chủ bắt sâu ngay.','prank');
 else if(b.id==='catch-prank'){endPrank();render();}
 else if(b.id==='job'&&model.rank>=2){model.job='working';notice.textContent='Đang mô phỏng công việc. Dùng nút trên thanh PHÁC THẢO để hoàn thành hoặc hủy.';render();}
 else if(b.id==='cancel-job'){model.job='idle';notice.textContent='Đã hủy: chưa nhận dấu, chưa mất lượt.';render();}
 else if(b.id==='exchange-feed'||b.id==='exchange-jar')confirm('Đổi 2 dấu ven ao?',b.id==='exchange-feed'?'Nhận 1 phần thức ăn ao; dùng lượt đổi hôm nay.':'Nhận 1 lọ sâu nghịch; giới hạn 2 lọ, vẫn phải đủ điều kiện mới thả được.',b.id);
 else if(b.id==='book-reward')confirm('Nhận kỷ niệm bến nước?','Một phiếu trang trí cho lần hoàn thành bộ sổ đầu tiên của vườn. Không cộng vật phẩm vào kho hoặc reset để nhận lại.','book-reward');
 else if(b.id==='fish')confirm('Xem một lần câu mẫu?','Bản mẫu cho kết quả cá nhỏ để xem Sổ cá. Game thật vẫn dùng thời gian, RNG, kho và hạn mức hiện có.','fish');
 else if(b.id==='cancel')dialog.close();
 else if(b.id==='accept'){
   dialog.close();
   if(pending==='take'&&plot==='ripe'&&!model.taken){model.taken=true;notice.textContent='Đã mô phỏng lấy một món. Lượt giúp/nghịch vẫn riêng.';}
   if(pending==='help'&&plot!=='ripe'&&!model.wet&&!model.helped){model.helped=true;model.wet=true;notice.textContent='Đã giúp tưới. Không tự trừ đồ của chủ hoặc sinh thưởng.';}
   if(pending==='prank'&&!prankBlock()){model.jars--;model.pranks++;model.prankActive=true;notice.textContent='Sâu nghịch đang chạy. Mức sâu tự nhiên vẫn 12%.';}
   if((pending==='exchange-feed'||pending==='exchange-jar')&&model.marks>=2&&!model.exchanged&&(pending!=='exchange-jar'||model.jars<2&&model.rank>=3)){model.marks-=2;model.exchanged=true;if(pending==='exchange-feed')model.feed++;else model.jars++;notice.textContent='Đã mô phỏng đổi một gói; hôm nay không đổi thêm.';}
   if(pending==='fish'&&!model.fishCooldown&&model.fishUsed<12){model.fishUsed++;model.fishCooldown=true;model.catches.minnow++;notice.textContent='Cá nhỏ đã ghi vào Sổ cá mẫu.';}
   if(pending==='book-reward'&&!model.bookClaimed&&Object.values(model.catches).every(n=>n>0)){model.bookClaimed=true;model.vouchers++;notice.textContent='Đã mô phỏng nhận 1 phiếu kỷ niệm. Không nhận lại từ bộ sổ này.';}
   pending='';render();
 }
});reset();
document.querySelector('#review-case').addEventListener('change',e=>{const selected=e.target.value;reset();e.target.value=selected;if(selected==='beginner'){model.rank=1;model.marks=2;}if(selected==='full'){model.marks=6;model.jars=2;}if(selected==='book'){model.catches={minnow:1,tilapia:1,goldenCarp:1};}page='lake';tab=selected==='book'?'book':'shore';render();});
</script></body></html>
