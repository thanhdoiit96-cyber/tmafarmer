<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phác thảo — Đơn làng đang cần</title><link rel="stylesheet" href="../../public/style.css">
<style>
body{margin:0;padding:12px;background:#f4efe1;color:#354b38;font-family:system-ui,sans-serif}.review,main{max-width:1080px;margin:auto}.review{font-size:12px;margin-bottom:12px}.review strong{display:block;margin-bottom:7px}.choices,.actions{display:flex;flex-wrap:wrap;gap:6px}.choices button{font-size:11px;min-height:32px}main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}.scene{border:5px solid #42624a;border-radius:14px;overflow:hidden;background:#314b38}.scene img{width:100%;display:block;image-rendering:pixelated}.scene p{color:#fff1cc;margin:0;padding:10px;font-size:12px}.sheet{background:#fff9e9;border:1px solid #ceb985;border-radius:12px;padding:14px;box-shadow:0 3px 0 #b9a06c}.sheet h1{font-size:21px;margin:8px 0}.sheet h2{font-size:16px;margin:8px 0}.tabs{display:flex;gap:5px;margin:12px 0}.tabs button{flex:1;font-size:11px;padding:6px}.muted{font-size:11px;color:#786b50;line-height:1.5}.ledger{background:#f2e5be;border:1px solid #c4a66a;border-radius:8px;padding:10px;margin:10px 0}.ledger p{margin:4px 0;font-size:12px}.needs{display:grid;gap:7px}.need{border:1px solid #d2bd8a;border-radius:8px;background:#f8efd7;padding:9px}.need.pinned{border:2px solid #5b7952;padding:8px}.need-head{display:flex;gap:7px;align-items:center}.need-head strong{flex:1;font-size:13px}.sprite{width:24px;height:24px;flex:none;background:url('../../public/pixel/vertical-slice-v2-hd.png') -168px 0/384px 128px;image-rendering:pixelated}.need progress{display:block;width:100%;height:7px;margin:7px 0;accent-color:#688451}.need p{margin:5px 0;font-size:11px}.need .btn{font-size:11px;min-height:30px;padding:5px 8px}.label{font-size:10px;color:#5d6d42}.sheet details{font-size:12px;margin-top:12px}.sheet summary{cursor:pointer;font-weight:700}.sheet li{margin:7px 0}.notice{min-height:18px;font-size:12px;color:#536b3f}dialog{max-width:360px;width:calc(100% - 40px);box-sizing:border-box;border:2px solid #bc9b5e;background:#fff6df;color:#354b38;border-radius:12px;padding:18px}dialog h2{font-size:19px}dialog p{font-size:13px;line-height:1.5}dialog input{width:100%;box-sizing:border-box;margin:8px 0}button:disabled{opacity:.5}button:focus-visible,summary:focus-visible{outline:2px solid #9a6c32;outline-offset:2px}
@media(max-width:900px) and (orientation:landscape){body{padding:7px}main{grid-template-columns:minmax(0,1fr) 290px;gap:8px}.scene{position:sticky;top:7px}.sheet{padding:10px}.review{font-size:10px}}
@media(max-width:580px) and (orientation:portrait){main{grid-template-columns:1fr}.scene{display:none}}
</style></head><body>
<section class="review"><strong>PHÁC THẢO P2.1 · Dữ liệu mô phỏng, không thao tác lên game. Chưa triển khai.</strong><div class="choices" id="examples"></div></section>
<main><section class="scene"><img src="market-viewport-v1.png" alt="Chợ làng trong game hiện có, dùng đối chiếu bố cục"><p>Giữ nguyên bản đồ · Chỉ thay bảng tác vụ bên cạnh</p></section><section class="sheet" aria-label="Bản mẫu bảng đơn làng"><small>Làng › Đơn hàng</small><nav class="tabs" aria-label="Loại đơn"><button class="btn subtle" data-tab="market">Đơn chợ</button><button class="btn primary" data-tab="village">Góp hàng làng</button></nav><div id="content"></div><p class="notice" id="notice" role="status" aria-live="polite"></p></section></main>
<dialog id="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><div id="confirm-body"></div><div class="actions"><button class="btn subtle" id="cancel">Để sau</button><button class="btn primary" id="accept">Xác nhận góp</button></div></dialog>
<script>
const $=s=>document.querySelector(s),names=['Lúa mì','Cà rốt','Bắp'],required=[16,12,12],examples=['Đang góp','Chưa có hàng','Món chưa mở','Sắp đủ','Hoàn thành','Hết hạn'];
let mode=0,pin=null,delivered,stock,mine,completed,expired,locked,tab='village',selection=null;
const buttons=(text,attrs,disabled=false)=>'<button class="btn subtle" '+attrs+(disabled?' disabled':'')+'>'+text+'</button>';
function reset(n){mode=n;pin=null;stock=n===1?[0,0,0]:[4,1,0];delivered=n===3?[15,12,12]:n===4?[16,12,12]:[10,4,8];mine=n===3?2:n===4?4:1;completed=n===4;expired=n===5;locked=n===2;tab='village';$('#notice').textContent='';render()}
function render(){
 $('#examples').innerHTML=examples.map((n,i)=>buttons(n,'data-example="'+i+'" aria-pressed="'+(mode===i)+'"')).join('');
 document.querySelectorAll('[data-tab]').forEach(b=>b.className='btn '+(b.dataset.tab===tab?'primary':'subtle'));
 if(tab==='market'){$('#content').innerHTML='<h1>Đơn chợ</h1><p class="muted">Giao đủ một lần · Người giao trước nhận trước.</p><p>Đơn chợ hiện có giữ nguyên. Góp từng phần cho cả làng ở tab bên cạnh.</p>';return}
 const total=required.reduce((a,b)=>a+b,0),done=delivered.reduce((a,b)=>a+b,0),ended=completed||expired;
 $('#content').innerHTML='<h1>Giỏ nông sản</h1><p class="muted">Góp từng phần cùng làng · '+(completed?'Đã hoàn thành':expired?'Đã hết hạn':'Còn 1 ngày 6 giờ (thời gian thực)')+'</p><div class="ledger"><p><strong>'+done+'/'+total+' món · '+Math.max(0,total-done)+' còn thiếu</strong></p><p>Bạn đã góp <b>'+mine+'</b> món · '+(completed?'Đã nhận thưởng theo luật hiện có.':expired?'Không đạt đích; hàng đã góp không hoàn lại.':mine<3?'Cần thêm '+(3-mine)+' món để đủ mốc thưởng.':'Đủ mốc cá nhân; chờ cả làng hoàn thành.')+'</p></div><div class="needs">'+names.map((name,i)=>{
 const missing=Math.max(0,required[i]-delivered[i]),can=!ended&&missing>0&&stock[i]>0&&!(locked&&i===2);
 return '<article class="need'+(pin===i?' pinned':'')+'"><div class="need-head"><span class="sprite" style="background-position:-168px -'+i*24+'px" aria-hidden="true"></span><strong>'+name+'</strong><span class="label">'+(missing?'Thiếu '+missing:'Đủ rồi')+'</span></div><progress value="'+delivered[i]+'" max="'+required[i]+'" aria-label="'+name+' đã góp"></progress><p>'+delivered[i]+'/'+required[i]+' đã góp · Kho bạn '+stock[i]+(pin===i?' · Đang ghim':'')+'</p><div class="actions">'+(ended||!missing?'':buttons('Góp'+(can?' · tối đa '+Math.min(stock[i],missing):''),'data-donate="'+i+'"',!can)+buttons(pin===i?'Bỏ ghim':'Ghim chuẩn bị','data-pin="'+i+'"')+buttons(locked&&i===2?'Điều kiện mở':'Cách có','data-source="'+i+'"'))+'</div></article>'}).join('')+'</div><p class="muted">Góp từ 3 món và cả làng hoàn thành mới có thưởng. Hàng góp không hoàn lại nếu hết hạn.</p><details><summary>Người cùng góp · 3 nhà</summary><ul><li>Cô Lan · '+Math.max(0,done-mine-5)+' món</li><li>Chú Bình · 5 món</li><li>Bạn · '+mine+' món</li></ul></details>';
}
$('#cancel').onclick=()=>$('#confirm').close();
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.example!==undefined)reset(Number(d.example));
 if(d.tab){tab=d.tab;render()}
 if(d.pin!==undefined){const i=Number(d.pin);if(pin!==null&&pin!==i&&!confirm('Thay món đang ghim bằng '+names[i]+'?'))return;pin=pin===i?null:i;render();$('#notice').textContent=pin===null?'Đã bỏ ghim.':'Mô phỏng: ghim '+names[pin]+' trong Việc cần làm, không ghim đè lên bản đồ.'}
 if(d.source!==undefined){const i=Number(d.source);$('#confirm-title').textContent='Cách có '+names[i].toLowerCase();$('#confirm-body').innerHTML=locked&&i===2?'<p>Món này chưa mở với vườn của bạn. Bản runtime sẽ lấy điều kiện cấp/công trình từ bộ chỉ dẫn hiện có, không ghi cứng điều kiện trong UI.</p><p>Bạn vẫn có thể góp lúa mì hoặc cà rốt đang có.</p>':'<p>Trồng từ hạt giống ở Vườn nhà. Kiểm tra hạt trong túi trước khi tới chợ mua thêm.</p><p>Nút runtime sẽ dẫn tới đúng giống hoặc bảng mua, không tự mua hay tự gieo.</p>';$('#accept').hidden=true;$('#confirm').showModal()}
 if(d.donate!==undefined){selection=Number(d.donate);const max=Math.min(stock[selection],required[selection]-delivered[selection]);$('#confirm-title').textContent='Góp '+names[selection].toLowerCase();$('#confirm-body').innerHTML='<p>Kho có '+stock[selection]+', làng còn cần '+(required[selection]-delivered[selection])+'.</p><label>Số lượng<input id="quantity" type="number" min="1" max="'+max+'" value="1"></label><p><strong>Hàng trừ khỏi kho ngay và không hoàn lại nếu hết hạn.</strong> Cần góp tổng từ 3 món và cả làng hoàn thành mới có thưởng.</p><p id="error" role="alert"></p>';$('#accept').hidden=false;$('#confirm').showModal()}
});
$('#accept').onclick=()=>{const n=Number($('#quantity').value),max=Math.min(stock[selection],required[selection]-delivered[selection]);if(!Number.isSafeInteger(n)||n<1||n>max){$('#error').textContent='Chọn số nguyên từ 1 đến '+max+'.';return}stock[selection]-=n;delivered[selection]+=n;mine+=n;completed=delivered.every((n,i)=>n===required[i]);$('#confirm').close();render();$('#notice').textContent='Mô phỏng đã góp '+n+' '+names[selection].toLowerCase()+'. Không trừ tài sản thật.'};
reset(0);
</script></body></html>
